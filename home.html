<style>
:root { --ink: #141117; --panel: #211c26; --line: #3d3546; --paper: #f5efe3; --muted: #aea2b6; --warn: #f1bb2a; color-scheme: dark; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--paper); font: 16px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif;
  display: grid; place-items: center; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); box-sizing: border-box; }
form { box-sizing: border-box; width: min(360px, 100%); display: flex; flex-direction: column; gap: 12px; padding: 24px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); }
h1 { margin: 0; font: 400 24px "Arial Black", Impact, sans-serif; letter-spacing: .02em; }
p { margin: 0; color: var(--muted); font-size: 14px; }
input { font: 600 16px system-ui, sans-serif; padding: 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--ink); color: var(--paper); }
input:focus { outline: none; border-color: var(--paper); }
button { font: 600 16px system-ui, sans-serif; padding: 12px; border-radius: 999px; border: 0; background: var(--paper); color: var(--ink); cursor: pointer; touch-action: manipulation; }
#err { color: var(--warn); min-height: 20px; }
</style>

    unlock(document.getElementById('pw').value.trim()).catch(function () { err.textContent = 'That password doesn’t match.'; });
  });
})();
</script>
