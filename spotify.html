<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#141117">
<title>Game Night · Spotify</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #141117; color: #f5efe3; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; line-height: 1.45; padding: 24px 16px; box-sizing: border-box; }
  .card { width: min(420px, 100%); box-sizing: border-box; padding: 24px 22px; border-radius: 20px; background: #211c26; border: 1px solid #3a3340; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .dot { width: 44px; height: 44px; border-radius: 50%; background: #1ed760; display: grid; place-items: center; color: #0b2414; }
  .dot svg { width: 24px; height: 24px; }
  h1 { margin: 0; font-size: 20px; }
  p { margin: 0; color: #b3a9b9; text-wrap: pretty; }
  .btn { display: inline-block; margin-top: 4px; padding: 10px 18px; border-radius: 999px; background: #f5efe3; color: #141117; font-weight: 700; text-decoration: none; }
  .btn[hidden] { display: none; }
</style>
</head>
<body>
<main class="card">
  <span class="dot" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></span>
  <h1 id="t">Connecting Spotify…</h1>
  <p id="m">One moment.</p>
  <a class="btn" id="back" href="./home.html" hidden>Back to Game Night</a>
</main>
<script>
// Spotify sends you here after you allow Game Night to play your music. This finishes the sign-in (with the one-time code
// and the key your host page made just before), keeps the result on this device, and takes you back where you were.
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search);
  var pend = null;
  try { pend = JSON.parse(localStorage.getItem('gamenight:spotify:pending') || 'null'); } catch (e) {}
  // only ever back to a page on this site
  var back = './home.html';
  if (pend && typeof pend.back === 'string') { try { var u = new URL(pend.back); if (u.origin === location.origin) back = u.href; } catch (e) {} }
  function fail(title, msg) { $('t').textContent = title; $('m').textContent = msg; $('back').href = back; $('back').hidden = false; }
  // (the one-time code shouldn't sit in the address bar or the history)
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  var err = q.get('error');
  if (err) { fail('Spotify isn’t connected', err === 'access_denied' ? 'You chose not to allow it. You can try again any time from the music bar.' : 'Spotify said: ' + err + '.'); return; }
  if (!pend || !q.get('code')) { fail('Nothing to connect', 'Start from the music bar on your Game Night page.'); return; }
  if (q.get('state') !== pend.state) { fail('Spotify isn’t connected', 'That sign-in didn’t match this phone. Please try connecting again.'); return; }
  var acc = 'https://accounts.spotify.com';
  try { var a = new URL(pend.acc); if (/^(127\.0\.0\.1|localhost)$/.test(a.hostname)) acc = a.origin; } catch (e) {}
  fetch(acc + '/api/token', {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: new URLSearchParams({grant_type: 'authorization_code', code: q.get('code'), redirect_uri: pend.redirect, client_id: pend.cid, code_verifier: pend.verifier})})
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return {ok: r.ok, j: j}; }); })
    .then(function (x) {
      if (!x.ok || !x.j.access_token) {
        fail('Spotify isn’t connected', 'Spotify said: ' + (x.j.error_description || x.j.error || 'no') + '. Check that the Client ID is right and the Redirect URI in your Spotify app matches exactly, then try again.');
        return;
      }
      localStorage.setItem('gamenight:spotify', JSON.stringify({cid: pend.cid, access: x.j.access_token, refresh: x.j.refresh_token, exp: Date.now() + (Number(x.j.expires_in) || 3600) * 1000}));
      localStorage.removeItem('gamenight:spotify:pending');
      $('t').textContent = 'Spotify connected';
      $('m').textContent = 'Taking you back…';
      location.replace(back);
    })
    .catch(function () { fail('Spotify isn’t connected', 'Couldn’t reach Spotify. Check your connection and try again.'); });
})();
</script>
</body>
</html>
