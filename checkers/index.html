<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>King Me</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="King Me">
<link rel="apple-touch-icon" href="../icons/checkers-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/checkers-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Bungee&display=swap">
<style>
:root {
  /* Layout: one centered column built for phones: header, notice, opponent bar, board, your bar, status, controls, moves.
     Same dark game-night look as Wild Draw and Back Rank, with a felt-green checkerboard. */
  --ink: #141117;
  --panel: #211c26;
  --panel-2: #2b2531;
  --line: #3d3546;
  --paper: #f5efe3;
  --muted: #aea2b6;
  --sq-light: #ecdcb8;
  --sq-dark: #3f6f4b;
  --last: rgba(241, 187, 42, .42);
  --sel: rgba(241, 187, 42, .75);
  --dot: rgba(245, 239, 227, .55);
  --red: #e2463c;
  --green: #2f9d58;
  --yellow: #f1bb2a;
  --font-display: "Bungee", "Arial Black", "Helvetica Neue", Impact, sans-serif;
  --font-ui: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--font-ui); font-size: 15px; line-height: 1.4; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }

.app {
  box-sizing: border-box;
  min-height: 100%;
  max-width: 620px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-block: max(12px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- header ---------- */
.top { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 20px; letter-spacing: .02em; }
.gem { width: 15px; height: 15px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f06a5f, #b8281f 65%); box-shadow: 4px 0 0 -1px #1d1a20, 4px 0 0 0 #5a5060; }
.score { display: flex; align-items: baseline; gap: 8px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 0; }
.score b { font-family: var(--font-display); font-weight: 400; font-size: 18px; color: var(--paper); }
.top-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.pill i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); box-sizing: border-box; }
.pill.on { color: var(--paper); }
.pill.on i { background: var(--green); border-color: var(--green); }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); cursor: pointer; padding: 0; }
.icon-btn:hover { background: var(--panel-2); }
.icon-btn svg { width: 18px; height: 18px; }

/* ---------- buttons ---------- */
.btn { font-weight: 600; font-size: 15px; padding: 9px 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--panel); color: var(--paper); cursor: pointer; transition: background .15s, transform .1s; }
.btn:hover:not(:disabled) { background: var(--panel-2); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--paper); border-color: var(--paper); color: var(--ink); }
.btn.primary:hover:not(:disabled) { background: #fff; }
.btn.small { font-size: 13px; padding: 6px 12px; }
.btn.danger { border-color: var(--red); color: #ffb3ad; }
.btn.armed { background: var(--red); border-color: var(--red); color: var(--paper); }

/* ---------- notice + join ---------- */
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 12px 10px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
.banner p { margin: 0; flex: 1 1 240px; min-width: 0; text-wrap: pretty; }
.banner-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.code { font-family: var(--font-display); font-weight: 400; letter-spacing: .14em; padding: 2px 8px; border-radius: 6px; background: var(--ink); color: var(--paper); white-space: nowrap; }
.join { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 14px; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
.join-copy { flex: 1 1 100%; }
.join h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 20px; }
.join-copy p { margin: 4px 0 0; color: var(--muted); }
.join label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); flex: 1 1 150px; min-width: 0; }
.field-input { box-sizing: border-box; width: 100%; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--ink); color: var(--paper); font-weight: 600; font-size: 16px; }
.field-input:focus { border-color: var(--paper); outline: none; }
#join-code { font-family: var(--font-display); font-weight: 400; letter-spacing: .2em; text-transform: uppercase; }
.join-note { flex-basis: 100%; margin: 0; min-height: 18px; font-size: 13px; color: var(--muted); }

/* ---------- player bars ---------- */
.bar { display: flex; align-items: center; gap: 10px; min-height: 40px; min-width: 0; }
.bar .who { display: flex; align-items: center; gap: 8px; min-width: 0; flex: none; max-width: 45%; }
.bar .who strong { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar:not(.turn) .who strong { color: var(--muted); }
.chip { width: 16px; height: 16px; border-radius: 50%; flex: none; }
.chip.b, .tiny.b { background: radial-gradient(circle at 35% 30%, #4a4450, #1d1a20 65%); box-shadow: 0 0 0 1.5px #5a5060; }
.chip.r, .tiny.r { background: radial-gradient(circle at 35% 30%, #f06a5f, #b8281f 65%); box-shadow: 0 0 0 1.5px #e0544a; }
.caps { display: flex; align-items: center; flex-wrap: wrap; min-width: 0; flex: 1 1 auto; row-gap: 2px; }
.tiny { width: 13px; height: 13px; border-radius: 50%; margin-right: -4px; }
.adv { margin-left: 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.clock { margin-left: auto; flex: none; font-family: var(--font-display); font-weight: 400; font-size: 17px; font-variant-numeric: tabular-nums;
  padding: 5px 10px; border-radius: 8px; background: var(--panel); color: var(--muted); min-width: 64px; text-align: right; }
.clock.run { background: var(--paper); color: var(--ink); }
.clock.low { background: var(--red); color: var(--paper); }

/* ---------- board ---------- */
.board-wrap { display: flex; gap: 8px; justify-content: center; align-items: stretch; }
.board {
  position: relative;
  flex: none;
  width: min(100%, 560px);
  width: min(100%, 560px, max(280px, calc(100dvh - 330px)));
  aspect-ratio: 1;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 0 0 3px var(--panel-2), 0 20px 40px -20px rgba(0, 0, 0, .8);
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.sq { position: relative; border: 0; border-radius: 0; padding: 0; margin: 0; min-width: 0; appearance: none; -webkit-appearance: none; background: var(--sq-light); -webkit-tap-highlight-color: transparent; }
.sq.dark { background: var(--sq-dark); cursor: pointer; }
.sq.last::before { content: ""; position: absolute; inset: 0; background: var(--last); }
.sq.sel::before { content: ""; position: absolute; inset: 0; background: var(--sel); }
.sq.trail::before { content: ""; position: absolute; inset: 0; background: rgba(241, 187, 42, .4); }
.sq.dot::after { content: ""; position: absolute; left: 36%; top: 36%; width: 28%; height: 28%; border-radius: 50%; background: var(--dot); z-index: 2; }
.sq.must .disc { box-shadow: 0 0 0 3px var(--yellow), 0 3px 5px rgba(0, 0, 0, .5); }
.sq.hang .disc { filter: drop-shadow(0 0 4px var(--red)) drop-shadow(0 0 2px var(--red)); }
.sq.hint::before { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 4px rgba(47, 157, 88, .95); }
.num { position: absolute; left: 6%; top: 4%; font-size: 9px; font-weight: 800; color: rgba(236, 220, 184, .45); pointer-events: none; }
.disc { position: absolute; inset: 11%; border-radius: 50%; z-index: 1; pointer-events: none; display: grid; place-items: center; box-shadow: 0 3px 5px rgba(0, 0, 0, .5); }
.disc.b { background: radial-gradient(circle at 35% 30%, #4d4753, #1d1a20 62%); }
.disc.r { background: radial-gradient(circle at 35% 30%, #f06a5f, #b8281f 62%); }
.disc::before { content: ""; position: absolute; inset: 12%; border-radius: 50%; }
.disc.b::before { box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .12); }
.disc.r::before { box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .22); }
.disc svg { position: relative; width: 52%; height: 52%; }
.disc.anim { animation: slide .26s cubic-bezier(.2, .8, .3, 1) both; z-index: 3; }
@keyframes slide { from { transform: translate(var(--dx), var(--dy)); } }
.arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
.arrows line { stroke-width: .16; stroke-linecap: round; }
.arrows polygon { stroke: none; }
.arrows .best line { stroke: rgba(241, 187, 42, .9); }
.arrows .best polygon { fill: rgba(241, 187, 42, .9); }
.arrows .threat line { stroke: rgba(226, 70, 60, .85); stroke-dasharray: .22 .14; }
.arrows .threat polygon { fill: rgba(226, 70, 60, .85); }

/* ---------- status, controls, moves ---------- */
.status { margin: 0; text-align: center; font-family: var(--font-display); font-weight: 400; font-size: 18px; min-height: 24px; text-wrap: balance; }
.status.wait { color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.moves { display: flex; gap: 4px 10px; overflow-x: auto; padding: 8px 10px; border-radius: 10px; background: var(--panel); font-size: 14px; white-space: nowrap; min-height: 22px; scrollbar-width: thin; }
.moves span { color: var(--muted); }
.moves b { font-weight: 600; font-variant-numeric: tabular-nums; }
.moves b.now { color: var(--yellow); }


/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(12, 9, 14, .74);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dialog { box-sizing: border-box; width: min(400px, 100%); padding: 22px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .7); display: flex; flex-direction: column; gap: 14px; }
.dialog h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.15; text-wrap: balance; }
.dialog p { margin: 0; color: var(--muted); }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }


.toast { position: fixed; z-index: 40; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  max-width: calc(100% - 32px); box-sizing: border-box; padding: 9px 16px; border-radius: 12px; background: var(--paper); color: var(--ink); font-weight: 600; font-size: 14px; text-align: center; box-shadow: 0 12px 30px -10px rgba(0, 0, 0, .7); }

/* ---------- Game Night kit: reactions, sound button, home link ---------- */
.react-bar { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
.react-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); font-size: 20px; line-height: 1; cursor: pointer; padding: 0; display: grid; place-items: center; transition: transform .1s; }
.react-btn:active { transform: scale(.9); }
.react-pop { position: fixed; z-index: 50; bottom: 30%; display: flex; flex-direction: column; align-items: center; gap: 2px; pointer-events: none; animation: react-rise 2.2s ease-out forwards; }
.react-emoji { font-size: 56px; line-height: 1; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .5)); }
.react-name { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--paper); color: var(--ink); }
.react-name:empty { display: none; }
@keyframes react-rise {
  0% { transform: translateY(30px) scale(.4); opacity: 0; }
  15% { transform: translateY(0) scale(1.15); opacity: 1; }
  25% { transform: translateY(-10px) scale(1); }
  80% { opacity: 1; }
  100% { transform: translateY(-180px) scale(.95); opacity: 0; }
}
.home-link { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--paper); text-decoration: none; }
.home-link svg { width: 18px; height: 18px; }
.review-list { display: flex; flex-direction: column; gap: 6px; max-height: 46vh; overflow-y: auto; margin: 0; padding: 0; list-style: none; }
.review-item { display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--paper); cursor: pointer; font-size: 14px; }
.review-item:hover { border-color: var(--paper); }
.review-item .tag { flex: none; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; }
.tag.blunder { background: var(--red); color: var(--paper); }
.tag.mistake { background: #e8833a; color: #2a1400; }
.tag.inaccuracy { background: var(--yellow); color: #2a1d00; }
.review-item .txt { min-width: 0; }
.review-item .txt b { font-weight: 700; }
.review-sum { display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.review-sum b { color: var(--paper); }
.review-banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 8px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 14px; }
.review-banner p { margin: 0; min-width: 0; flex: 1 1 200px; }
#review-note { margin: 0; font-size: 13px; color: var(--muted); }
#review-tabs .seg { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; }
#review-tabs .seg button { flex: 1; border: 0; background: none; color: var(--muted); padding: 6px 11px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; }
#review-tabs .seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); }
/* advantages switch: sections marked .adv dim while advantages are off */
.edge-off .adv { opacity: .4; pointer-events: none; }
.edge-sec .seg button[data-v="off"][aria-pressed="true"] { background: var(--green, #2f9d58); color: #fff; }

@media (max-width: 480px) {
  .brand { font-size: 17px; }
  .status { font-size: 16px; }
  .btn { padding: 8px 14px; font-size: 14px; }
  .clock { font-size: 15px; min-width: 56px; }
  .num { font-size: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="gem" aria-hidden="true"></span>King Me</div>
    <div class="score" id="score" aria-label="Score"></div>
    <div class="top-tools">
      <span class="pill" id="pill"><i></i><span id="pill-text"></span></span>
      <button class="icon-btn" id="mute" type="button"></button>
      <a class="home-link" id="home-link" href="../play/" aria-label="All games" title="All games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></a>

    </div>
  </header>

  <form class="join" id="join" autocomplete="off">
    <div class="join-copy">
      <h2>Join a game</h2>
      <p>Type the 4-letter table code your friend sent you.</p>
    </div>
    <label>Table code<input class="field-input" id="join-code" maxlength="4" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="ABCD"></label>
    <label>Your name<input class="field-input" id="join-name" maxlength="20" placeholder="Name"></label>
    <button class="btn primary" id="join-btn" type="submit">Join</button>
    <p class="join-note" id="join-note" aria-live="polite"></p>
  </form>

  <div class="banner" id="banner" hidden><p id="banner-text"></p><div class="banner-actions" id="banner-actions"></div></div>
  <div class="review-banner" id="preview-bar" hidden><p id="preview-text"></p><div class="row"><button class="btn small" id="preview-back" type="button">Back to review</button><button class="btn small primary" id="preview-done" type="button">Back to game</button></div></div>

  <div class="bar" id="op-bar">
    <div class="who"><span class="chip" id="op-chip"></span><strong id="op-name">Computer</strong></div>
    <div class="caps" id="op-caps"></div>
    <div class="clock" id="op-clock" hidden></div>
  </div>

  <div class="board-wrap" id="board-wrap">

    <div class="board" id="board" role="grid" aria-label="Checkerboard"></div>
  </div>

  <div class="bar" id="me-bar">
    <div class="who"><span class="chip" id="me-chip"></span><strong id="me-name">You</strong></div>
    <div class="caps" id="me-caps"></div>
    <div class="clock" id="me-clock" hidden></div>
  </div>


  <p class="status" id="status" aria-live="polite"></p>
  <div class="controls">

    <button class="btn" id="btn-draw" type="button" hidden>Offer draw</button>
    <button class="btn danger" id="btn-resign" type="button" hidden>Resign</button>
    <button class="btn" id="btn-new" type="button" hidden>New game</button>
  </div>
  <div class="moves" id="moves" aria-label="Moves"></div>
  <div class="react-bar" id="react-bar" hidden></div>
</div>

<div class="overlay" id="over" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="over-title">
    <p class="eyebrow">Game over</p>
    <h2 id="over-title"></h2>
    <p id="over-score"></p>
    <p id="over-note" hidden></p>
    <div class="row" id="over-actions"></div>
  </div>
</div>

<div class="overlay" id="review" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="review-title">
    <p class="eyebrow">Game review</p>
    <h2 id="review-title">Your moves</h2>
    <div id="review-tabs"></div>
    <div class="review-sum" id="review-sum"></div>
    <ul class="review-list" id="review-list"></ul>
    <p class="note" id="review-note"></p>
    <div class="row"><button class="btn" id="review-close" type="button">Close</button></div>
  </div>

<script>// ---------- Game Night kit: device id, sounds, turn alerts, emoji reactions ----------
const Kit = (() => {
  const st = {
    get(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }
  };
  // A random id that stays on this device, so the host can keep each friend's record.
  function deviceId() {
    let d = st.get('gamenight:device', null);
    if (typeof d !== 'string' || !/^[a-z0-9]{8,32}$/.test(d)) {
      d = (Math.random().toString(36).slice(2) + Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/[^a-z0-9]/g, '').slice(0, 20);
      st.set('gamenight:device', d);
    }
    return d;
  }

  // ----- sounds, made on the fly with Web Audio (no files to load) -----
  let ctx = null;
  let muted = !!st.get('gamenight:mute', false);
  function unlock() {
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
    } catch {}
  }
  document.addEventListener('pointerdown', unlock, {passive: true});
  document.addEventListener('keydown', unlock);
  function tone(freq, at, dur, type = 'sine', vol = 0.15, slide = 0) {
    const t = ctx.currentTime + at;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);

<script>// ---------- connections: PeerJS first, an encrypted MQTT relay as the backup ----------

    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }
  };
  // Test hooks: ?peerserver=host:port (self-hosted PeerJS), ?relay=ws://host:port/path (self-hosted broker), ?forcerelay=1, ?norelay=1.

  function makeRelayConn(br, r, id, outTopic) {

  }

      stop() { alive = false; clearTimeout(timer); try { peer && peer.destroy(); } catch {} try { current && current.close(); } catch {} },

    };
  }

  // ===== probe: is a table open under this code? (used by the Game Night hub; never takes anyone's seat) =====
  // All checks share one connection to the connection server, so looking at many tables at once stays light.
  const Probe = {peer: null, ready: null, waiting: new Map(), idle: 0};
  function resetProbe() {
    const fns = [...Probe.waiting.values()];
    Probe.waiting.clear();
    try { Probe.peer && Probe.peer.destroy(); } catch {}
    Probe.peer = null;
    Probe.ready = null;
    fns.forEach(fn => fn());
  }
  function probePeer() {
    if (Probe.ready) return Probe.ready;
    Probe.ready = new Promise((resolve, reject) => {
      let p;
      try { p = new Peer(peerOptions()); } catch (e) { Probe.ready = null; reject(e); return; }
      Probe.peer = p;
      p.on('open', () => resolve(p));
      p.on('error', err => {
        if (Probe.peer !== p) return;
        if (err.type === 'peer-unavailable') {
          const m = /peer\s+(\S+)/i.exec(err.message || '');
          const fn = m && Probe.waiting.get(m[1]);
          if (fn) fn();
          return;
        }
        reject(err);
        resetProbe();
      });
      p.on('disconnected', () => { if (Probe.peer === p) resetProbe(); });
    });
    return Probe.ready;
  }
  function releaseProbe() {
    clearTimeout(Probe.idle);
    Probe.idle = setTimeout(() => {
      if (Probe.waiting.size || !Probe.peer) return;
      const p = Probe.peer;
      Probe.peer = null;
      Probe.ready = null;
      try { p.destroy(); } catch {}
    }, 20000);
  }
  function probe({game, prefix, code, dev}) {
    return new Promise(resolve => {
      const id = prefix + code;
      let settled = false, relayStarted = false;
      const finish = (res, conn) => {
        if (settled) return;
        settled = true;
        clearTimeout(t);
        if (Probe.waiting.get(id) === fallback) Probe.waiting.delete(id);
        try { conn && conn.close(); } catch {}
        releaseProbe();
        resolve(res);
      };
      const ask = conn => {
        conn.on('data', msg => {
          if (msg && msg.type === 'probe-ok') {
            finish({open: true, host: String(msg.host || ''), busy: !!msg.busy, via: conn.via, codes: msg.codes || null, rec: msg.rec || null, tables: msg.open || null}, conn);
          }
        });
        conn.send(dev ? {type: 'probe', dev} : {type: 'probe'});
      };
      const viaRelay = () => {
        if (relayStarted || settled) return;
        relayStarted = true;
        relayJoin(game, code, 5000).then(c => {
          if (!c) { finish({open: false}); return; }
          if (settled) { try { c.close(); } catch {} return; }
          ask(c);
        }, () => finish({open: false}));
      };
      const fallback = () => viaRelay();
      const t = setTimeout(() => finish({open: false}), 14000);
      if (forceRelay || typeof Peer !== 'function') { viaRelay(); return; }
      Probe.waiting.set(id, fallback);
      probePeer().then(p => {
        if (settled) return;
        const c = p.connect(id, {reliable: true});
        c.on('open', () => { c.via = 'p2p'; ask(c); });
        c.on('error', () => {});
      }, fallback);
    });
  }

  return {host, join, probe, newCode};
})();
</script>

<script id="rules">
// American checkers. Board: 64 squares (row * 8 + col), pieces on dark squares only.
// 1 = black man, 2 = black king, -1 = red man, -2 = red king. Black starts at the top and moves first.
const CK = (() => {
  const START = [];
  for (let sq = 0; sq < 64; sq++) {
    const r = sq >> 3, c = sq & 7;
    START.push((r + c) % 2 === 1 ? (r < 3 ? 1 : r > 4 ? -1 : 0) : 0);
  }
  const ALL = [[1, -1], [1, 1], [-1, -1], [-1, 1]];
  const dirsFor = p => (p === 2 || p === -2 ? ALL : p > 0 ? ALL.slice(0, 2) : ALL.slice(2));
  const crowns = (p, sq) => (p === 1 && sq >> 3 === 7) || (p === -1 && sq >> 3 === 0);
  function jumps(b, from, p, sq, path, caps, out) {
    let more = false;
    const r = sq >> 3, c = sq & 7;
    for (const [dr, dc] of dirsFor(p)) {
      const lr = r + 2 * dr, lc = c + 2 * dc;
      if (lr < 0 || lr > 7 || lc < 0 || lc > 7) continue;
      const mid = (r + dr) * 8 + c + dc, land = lr * 8 + lc;
      if (b[mid] * p >= 0 || caps.includes(mid)) continue;
      if (b[land] !== 0 && land !== from) continue;
      more = true;
      const np = path.concat(land), nc = caps.concat(mid);
      if (crowns(p, land)) out.push({path: np, caps: nc}); // a man that reaches the far row stops there
      else jumps(b, from, p, land, np, nc, out);
    }
    if (!more && caps.length) out.push({path, caps});
  }
  // Legal moves for `side` (1 black, -1 red). Jumps are mandatory and must be finished.
  function moves(b, side) {
    const caps = [];
    for (let sq = 0; sq < 64; sq++) if (b[sq] && Math.sign(b[sq]) === side) jumps(b, sq, b[sq], sq, [sq], [], caps);
    if (caps.length) return caps;
    const quiet = [];
    for (let sq = 0; sq < 64; sq++) {
      const p = b[sq];
      if (!p || Math.sign(p) !== side) continue;
      const r = sq >> 3, c = sq & 7;
      for (const [dr, dc] of dirsFor(p)) {
        const nr = r + dr, nc = c + dc;
        if (nr < 0 || nr > 7 || nc < 0 || nc > 7) continue;
        if (b[nr * 8 + nc] === 0) quiet.push({path: [sq, nr * 8 + nc], caps: []});
      }
    }
    return quiet;
  }
  function apply(b, m) {
    const n = b.slice();
    const from = m.path[0], to = m.path[m.path.length - 1];
    let p = n[from];
    n[from] = 0;
    for (const c of m.caps) n[c] = 0;
    if (crowns(p, to)) p *= 2;
    n[to] = p;
    return n;
  }
  const num = sq => (sq >> 3) * 4 + ((sq & 7) >> 1) + 1;
  const notation = m => m.path.map(num).join(m.caps.length ? 'x' : '-');
  const samePath = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
  const CHARS = {'0': '.', '1': 'b', '2': 'B', '-1': 'r', '-2': 'R'};
  const toStr = b => b.map(p => CHARS[p]).join('');
  const fromStr = s => [...s].map(ch => ({'.': 0, b: 1, B: 2, r: -1, R: -2})[ch] ?? 0);
  return {START, moves, apply, num, notation, samePath, toStr, fromStr};
})();
</script>

<script>
const ROLE = 'player';
const GAME = 'checkers';
const PREFIX = 'kingme-v1-';
const PROTO = 2;
const SAVE_KEY = `kingme:${ROLE}:v1`;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[ch]));
const store = Kit.store;
const rid = () => Math.random().toString(36).slice(2, 10);
const otherColor = c => (c === 'b' ? 'r' : 'b');
const otherSeat = s => (s === 'A' ? 'B' : 'A');
const sideOf = c => (c === 'b' ? 1 : -1);
const colorOfSide = n => (n === 1 ? 'b' : 'r');
const COLOR_NAME = {b: 'Black', r: 'Red'};
const TIME_CONTROLS = {'0': null, '3+2': {base: 180, inc: 2}, '5+3': {base: 300, inc: 3}, '10+5': {base: 600, inc: 5}};
const CROWN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18l-1.6-10-4.6 4.2L12 5.5 9.2 12.2 4.6 8z" fill="#f1bb2a" stroke="#7a5600" stroke-width="1" stroke-linejoin="round"/></svg>';
const cleanName = n => String(n || '').replace(/[^\p{L}\p{N} '._-]/gu, '').trim().slice(0, 20);

// <game>
// A game record: {gid, moves: [[from, ...landings], ...], colorA, tc, clock, turnStart, result, offer}. Seat A is this page.
const replayCache = new WeakMap();
function freshPosition() { const b = CK.START.slice(); return {b, turn: 1, keys: [CK.toStr(b) + 1], quiet: 0, hist: [], lastPath: null}; }
function advance(st, m) {
  const man = Math.abs(st.b[m.path[0]]) === 1;
  st.b = CK.apply(st.b, m);
  st.turn = -st.turn;
  st.quiet = m.caps.length || man ? 0 : st.quiet + 1;
  st.keys.push(CK.toStr(st.b) + st.turn);
  st.hist.push(CK.notation(m));
  st.lastPath = m.path;
}
function findMove(st, path) { return CK.moves(st.b, st.turn).find(m => CK.samePath(m.path, path)) || null; }
function gameOf(s) {
  let st = replayCache.get(s);
  if (!st || st.n !== s.moves.length) {
    st = freshPosition();
    for (const path of s.moves) advance(st, findMove(st, path));
    st.n = s.moves.length;
    replayCache.set(s, st);
  }
  return st;
}
const colorOf = (s, seat) => (seat === 'A' ? s.colorA : otherColor(s.colorA));
const turnColor = st => colorOfSide(st.turn);
function newCheckersGame({colorA = 'b', tc = null} = {}) {
  return {gid: rid(), moves: [], colorA, tc, clock: tc ? {b: tc.base * 1000, r: tc.base * 1000} : null, turnStart: 0, result: null, offer: null};
}
function clockLeft(s, color, now = Date.now()) {
  if (!s.tc) return null;
  let t = s.clock[color];
  if (!s.result && s.moves.length >= 1 && turnColor(gameOf(s)) === color) t -= now - s.turnStart;
  return Math.max(0, t);
}
function tickClock(s) {
  if (!s || !s.tc || s.result || s.moves.length < 1) return false;
  const c = turnColor(gameOf(s));
  if (clockLeft(s, c) > 0) return false;
  s.clock[c] = 0;
  s.result = {winner: otherColor(c), reason: 'time'};
  return true;
}
function endCheck(s, st) {
  if (!CK.moves(st.b, st.turn).length) {
    const stuck = st.b.some(p => p && Math.sign(p) === st.turn);
    s.result = {winner: colorOfSide(-st.turn), reason: stuck ? 'blocked' : 'captured'};
  } else if (st.keys.filter(k => k === st.keys[st.keys.length - 1]).length >= 3) s.result = {winner: null, reason: 'repetition'};
  else if (st.quiet >= 80) s.result = {winner: null, reason: 'forty'};
}
function actGame(s, seat, a) {
  const fail = m => ({ok: false, err: m});
  if (!a || s.result) return fail('This game is over.');
  if (tickClock(s)) return {ok: true};
  const st = gameOf(s), me = colorOf(s, seat), them = otherSeat(seat);
  if (a.t === 'move') {
    if (turnColor(st) !== me) return fail('Wait for your turn.');
    const m = Array.isArray(a.path) ? findMove(st, a.path) : null;
    if (!m) return fail('That move isn’t allowed.');
    advance(st, m);
    st.n = s.moves.length + 1;
    s.moves.push(m.path.slice());
    if (s.tc) {
      const now = Date.now();
      if (s.moves.length > 1) s.clock[me] = Math.max(0, s.clock[me] - (now - s.turnStart)) + s.tc.inc * 1000;
      s.turnStart = now;
    }
    if (s.offer === them) s.offer = null;
    endCheck(s, st);
    return {ok: true};
  }
  if (a.t === 'resign') { s.result = {winner: otherColor(me), reason: 'resign'}; return {ok: true}; }
  if (a.t === 'draw') {
    if (s.offer === them) { s.result = {winner: null, reason: 'agreement'}; return {ok: true}; }
    if (s.offer === seat) return fail('You already offered a draw.');
    s.offer = seat;
    return {ok: true};
  }
  if (a.t === 'decline') { if (s.offer === them) s.offer = null; return {ok: true}; }
  return fail('Unknown move.');
}
// What one side sees. Checkers has no hidden information, so both views carry the same board.
function toView(s, seat) {
  const st = gameOf(s), me = colorOf(s, seat);
  const rel = c => (c == null ? null : c === me ? 'me' : 'op');
  return {
    gid: s.gid, board: CK.toStr(st.b), turn: turnColor(st), hist: st.hist.slice(), last: st.lastPath, me,
    clock: s.tc ? {b: clockLeft(s, 'b'), r: clockLeft(s, 'r'), run: !s.result && s.moves.length >= 1 ? turnColor(st) : null} : null,
    result: s.result ? {win: rel(s.result.winner), why: s.result.reason} : null,
    offer: s.offer ? (s.offer === seat ? 'me' : 'op') : null
  };
}
// </game>

// ---------- app state ----------
const App = {
  mode: 'solo',            // 'solo' (practice) · 'host' (you run the game for a friend) · 'guest' (at a friend's game)
  settings: {color: 'alt', tc: '0', skill: 2},
  solo: null,
  host: null,
  hostName: '',
  guest: {sid: rid(), n: 0, waitN: 0, msg: null, pending: null, view: null, hostName: 'Host', myName: '', old: false},
  ui: {sel: null, path: [], boardKey: '', animKey: '', bannerKey: '', overKey: '', overDismissed: null, resignArmed: 0, movesKey: '',
    myTurnKey: '', preview: null, reviewTab: 'me', endSound: null}
};
// Connection state. host: Net.info = {code, ready, p2p, relay, note}; guest: Net.state 'off' · 'connecting' · 'connected' · 'nohost' · 'lost'
const Net = {state: 'off', note: '', code: '', link: null, conn: null, info: null};

function oppName(v) {
  if (v && v.free) return COLOR_NAME[otherColor(v.me)];
  if (App.mode === 'host') return App.host.guestName || 'Friend';
  if (App.mode === 'guest') return App.guest.hostName || 'Host';
  return 'Computer';
}
function save() {
  const H = App.host;
  store.set(SAVE_KEY, {
    settings: App.settings,
    solo: App.solo,
    host: ROLE === 'host' ? {s: H.s, score: H.score, nextColor: H.nextColor, guestName: H.guestName, guestDev: H.guestDev, lastN: H.lastN, scored: H.scored} : null,
    mode: App.mode === 'guest' ? 'solo' : App.mode
  });
}
function soloIsFree() { return ROLE !== 'host' || Role.engineFailed(); }
function baseView() {
  if (App.mode === 'guest') {
    const G = App.guest;
    if (!G.view) return null;
    if (G.waitN && G.pending) {
      // Show her own move straight away while the host confirms it.
      const b = CK.fromStr(G.view.board);
      const m = CK.moves(b, sideOf(G.view.turn)).find(x => CK.samePath(x.path, G.pending.path));
      if (m) return {...G.view, board: CK.toStr(CK.apply(b, m)), turn: otherColor(G.view.turn), hist: [...G.view.hist, CK.notation(m)], last: m.path, offer: null};
    }
    return G.view;
  }
  const ctx = App.mode === 'host' ? App.host : App.solo;
  if (!ctx.s) return null;
  const v = toView(ctx.s, 'A');
  v.at = Date.now();
  v.sc = [ctx.score.A, ctx.score.B];
  v.free = App.mode === 'solo' && soloIsFree();
  return v;
}
// While a reviewed move is on show, the board shows the position before it.
function currentView() {
  const v = baseView();
  const p = App.ui.preview;
  if (!v || !p) return v;
  return {...v, board: p.item.board, turn: p.item.color, last: null, offer: null, clock: null, previewing: true};
}
function interactive() {
  if (App.mode !== 'guest') return true;
  return Net.state === 'connected' && !App.guest.waitN;
}
function canMove(v) {
  if (!v || v.result || v.previewing || !interactive()) return false;
  return v.free || v.turn === v.me;
}
function tally() {
  for (const ctx of [App.solo, App.host]) {
    const s = ctx && ctx.s;
    if (!s || !s.result || ctx.scored === s.gid) continue;
    ctx.scored = s.gid;
    const w = s.result.winner;
    if (w == null) { ctx.score.A += 0.5; ctx.score.B += 0.5; }
    else ctx.score[w === s.colorA ? 'A' : 'B'] += 1;
    if (ctx === App.host) Role.recordGame(s);
  }
}
function afterChange() {
  tally();
  save();
  Role.publish();
  render();
  Role.after();
}
function pickColor(ctx) {
  if (App.settings.color === 'b' || App.settings.color === 'r') return App.settings.color;
  const c = ctx.nextColor || 'b';
  ctx.nextColor = otherColor(c);
  return c;
}
function dealSolo() {
  const S = App.solo;
  App.mode = 'solo';
  S.s = newCheckersGame({colorA: soloIsFree() ? 'b' : pickColor(S)});
  clearSelection();
  closeOverlays();
  afterChange();
}
function backToSolo() { App.mode = 'solo'; App.guest.view = null; App.guest.waitN = 0; App.guest.pending = null; clearSelection(); closeOverlays(); afterChange(); }
function clearSelection() { App.ui.sel = null; App.ui.path = []; }

function doAction(a) {
  if (App.mode === 'guest') {
    if (!App.guest.view || !interactive()) return;
    Role.send({type: 'act', a});
    return;
  }
  const ctx = App.mode === 'host' ? App.host : App.solo;
  if (!ctx.s) return;
  const v = baseView();
  // On a practice board you move both sides, so the move belongs to whoever is to play.
  const seat = v.free && a.t === 'move' ? (colorOf(ctx.s, 'A') === v.turn ? 'A' : 'B') : 'A';
  const r = actGame(ctx.s, seat, a);
  if (!r.ok) { toast(r.err); return; }
  afterChange();
}
function cleanAct(a) {
  const path = Array.isArray(a.path) && a.path.length >= 2 && a.path.length <= 12 && a.path.every(x => Number.isInteger(x) && x >= 0 && x < 64) ? a.path : null;
  return {t: ['move', 'resign', 'draw', 'decline'].includes(a.t) ? a.t : null, path};
}
function copyText(value, done) {
  try { navigator.clipboard.writeText(value).then(() => toast(done), () => toast(value)); }
  catch { toast(value); }
}
let wakeLock = null;
async function keepAwake() {
  try { if (!wakeLock && navigator.wakeLock && document.visibilityState === 'visible') { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch {}
}
document.addEventListener('pointerdown', keepAwake, {passive: true});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  keepAwake();
  Role.wake();
});

// ---------- game review (shared display; the host's engine does the analysis) ----------
const KIND_WORD = {blunder: 'Blunder', mistake: 'Mistake', inaccuracy: 'Inaccuracy'};
function reviewSummary(items) {
  const n = k => items.filter(x => x.kind === k).length;
  const parts = [['blunder', 'blunders'], ['mistake', 'mistakes'], ['inaccuracy', 'inaccuracies']]
    .map(([k, plural]) => n(k) ? `<b>${n(k)}</b> ${n(k) === 1 ? k : plural}` : '').filter(Boolean);
  return parts.length ? parts.join(' · ') : 'No real mistakes. Nicely played.';
}
function openReview(tab) {
  const sets = Role.reviewSets();
  if (!sets.length) return;
  if (tab) App.ui.reviewTab = tab;
  if (!sets.some(x => x.key === App.ui.reviewTab)) App.ui.reviewTab = sets[0].key;
  const set = sets.find(x => x.key === App.ui.reviewTab);
  $('review-title').textContent = set.title;
  $('review-tabs').innerHTML = sets.length > 1
    ? `<div class="seg wide" role="tablist">${sets.map(x => `<button type="button" data-tab="${x.key}" aria-pressed="${x.key === set.key}">${esc(x.label)}</button>`).join('')}</div>` : '';
  $('review-sum').innerHTML = reviewSummary(set.items);
  $('review-list').innerHTML = set.items.map((it, i) => {
    const better = it.bestSan ? ` Better was <b>${esc(it.bestSan)}</b>.` : '';
    return `<li><button type="button" class="review-item" data-i="${i}"><span class="tag ${it.kind}">${KIND_WORD[it.kind]}</span><span class="txt">Move ${it.num}: <b>${esc(it.san)}</b>.${better}</span></button></li>`;
  }).join('');
  $('review-note').textContent = set.items.length ? 'Tap a move to see it on the board.' : '';
  App.ui.reviewSet = set;
  $('over').hidden = true;
  $('review').hidden = false;
}
function showPreview(item) {
  const v = baseView();
  App.ui.preview = {item};
  if (v) App.ui.overDismissed = v.gid;
  clearSelection();
  $('review').hidden = true;
  const who = App.ui.reviewSet && App.ui.reviewSet.key === 'them' ? oppName(v) : 'You';
  $('preview-text').innerHTML = `Move ${item.num}: ${esc(who)} played <b>${esc(item.san)}</b> (${KIND_WORD[item.kind].toLowerCase()}, red arrow).` +
    (item.bestSan ? ` Better was <b>${esc(item.bestSan)}</b> (gold arrow).` : '');
  $('preview-bar').hidden = false;
  render();
}
function endPreview() {
  App.ui.preview = null;
  $('preview-bar').hidden = true;
  render();
}
$('review-tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) openReview(b.dataset.tab); });
$('review-list').addEventListener('click', e => {
  const b = e.target.closest('[data-i]');
  if (b && App.ui.reviewSet) showPreview(App.ui.reviewSet.items[Number(b.dataset.i)]);
});
$('review-close').addEventListener('click', () => { $('review').hidden = true; App.ui.overKey = ''; render(); });
$('preview-back').addEventListener('click', () => { endPreview(); openReview(); });
$('preview-done').addEventListener('click', endPreview);
const okPath = p => Array.isArray(p) && p.length >= 2 && p.length <= 12 && p.every(x => Number.isInteger(x) && x >= 0 && x < 64);
function cleanReviewItems(items) {
  if (!Array.isArray(items)) return [];
  return items.slice(0, 120).filter(x => x && typeof x.board === 'string' && /^[.bBrR]{64}$/.test(x.board) && KIND_WORD[x.kind]).map(x => ({
    num: Number(x.num) || 0, color: x.color === 'r' ? 'r' : 'b', san: String(x.san || '').slice(0, 40), bestSan: String(x.bestSan || '').slice(0, 40),
    played: okPath(x.played) ? x.played : null, best: okPath(x.best) ? x.best : null, board: x.board, kind: x.kind
  }));
}


// ================= player: join a friend's game =================
function playerJoin(code) {
  code = String(code || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  if (code.length !== 4) { toast('Table codes are 4 letters.'); return; }
  if (Net.link) Net.link.stop();
  Net.code = code;
  store.set('kingme:join', {code, name: App.guest.myName});
  Net.conn = null;
  Net.link = Link.join({
    game: GAME, prefix: PREFIX, code,
    onConn: conn => {
      Net.conn = conn;
      Net.state = 'connected';
      Net.note = '';
      conn.on('data', playerOnData);
      conn.send({type: 'hello', proto: PROTO, name: App.guest.myName || 'Friend', sid: App.guest.sid, dev: Kit.deviceId()});
      if (App.guest.waitN && App.guest.msg) conn.send(App.guest.msg);
      render();
    },
    onState: state => {
      Net.conn = null;
      Net.state = state;
      Net.note = state === 'nohost' ? `No table is open with code ${code} right now. Checking again every few seconds.`
        : state === 'lost' ? (App.mode === 'guest' ? `Lost the connection to ${App.guest.hostName}. Reconnecting…` : 'Couldn’t reach the table. Trying again…') : '';

    }

}
function validView(g) {
  return !!g && typeof g === 'object' && typeof g.board === 'string' && /^[.bBrR]{64}$/.test(g.board) &&
    ['b', 'r'].includes(g.turn) && ['b', 'r'].includes(g.me) && Array.isArray(g.hist);
}
function playerOnData(msg) {
  if (!msg || typeof msg !== 'object') return;
  const G = App.guest;
  if (msg.type === 'react') { if (Kit.validEmoji(msg.e)) Kit.showReaction(msg.e, G.hostName); return; }
  if (msg.type === 'full') { Net.note = 'That table already has a player.'; toast(Net.note); return; }
  if (msg.type !== 'state') return;
  G.old = msg.proto !== PROTO;
  G.hostName = cleanName(msg.host) || 'Host';
  const g = msg.g;
  if (validView(g)) {
    g.at = Date.now();
    g.hist = g.hist.map(x => String(x).slice(0, 40));
    g.last = okPath(g.last) ? g.last : null;
    const r = g.review;
    g.review = r && typeof r === 'object' ? (r.pending ? {pending: true, progress: Number(r.progress) || 0} : {items: cleanReviewItems(r.items)}) : null;
    G.view = g;
    const ack = g.ack;
    if (G.waitN && ack && ack.sid === G.sid && ack.n >= G.waitN) {
      if (ack.e) toast(String(ack.e).slice(0, 140));
      G.waitN = 0;
      G.msg = null;
      G.pending = null;
    }
    if (App.mode !== 'guest') { App.mode = 'guest'; clearSelection(); closeOverlays(); }
  } else if (App.mode === 'guest') {
    App.mode = 'solo';
    G.view = null;
    G.waitN = 0;
    G.pending = null;
  }
  render();
}
function askRematch() {
  if (Net.state !== 'connected') return;
  Role.send({type: 'rematch'});
  if (App.guest.view) App.guest.view.asked = true;
  toast(`Asked ${App.guest.hostName} for a rematch.`);
  App.ui.overKey = '';
  App.ui.bannerKey = '';
  render();
}

const codeFromLink = () => ((location.hash.match(/^#([A-Za-z]{4})$/) || [])[1] || '').toUpperCase();
window.addEventListener('hashchange', () => {
  const code = codeFromLink();
  if (!code || code === Net.code) return;
  $('join-code').value = code;
  if (App.guest.myName) playerJoin(code);
});
$('join').addEventListener('submit', e => {
  e.preventDefault();
  App.guest.myName = cleanName($('join-name').value);
  playerJoin($('join-code').value);
});

const Role = {
  start() {
    const j = store.get('kingme:join', null) || {};
    App.guest.myName = cleanName(j.name);
    const code = codeFromLink() || j.code || '';
    $('join-name').value = App.guest.myName;
    $('join-code').value = code;
    if (code && App.guest.myName) playerJoin(code);
    else if (code) Net.note = 'Type your name and tap Join.';
  },
  engineFailed() { return true; },
  after() {},
  publish() {},
  send(msg) {
    const G = App.guest;
    if (msg.type === 'act') {
      G.n += 1;
      G.waitN = G.n;
      G.pending = msg.a.t === 'move' ? msg.a : null;
      G.msg = {...msg, n: G.n, g: G.view.gid, sid: G.sid};
      msg = G.msg;
    }
    try { Net.conn.send(msg); } catch {}
    render();
  },
  recordGame() {},
  pill() {
    const host = App.guest.hostName || 'Host';
    switch (Net.state) {
      case 'connected': return {on: true, text: `${host} is here`};
      case 'connecting': return {on: false, text: 'Connecting…'};
      case 'nohost': return {on: false, text: 'Waiting for the table'};
      case 'lost': return {on: false, text: 'Reconnecting…'};
      default: return {on: false, text: 'Not at a table'};
    }
  },
  banner(v) {
    const G = App.guest;
    const host = G.hostName || 'Host';
    if (Net.state === 'connected' && G.old) return {text: `${host}’s table is running an older version. Ask them to reload their table page.`};
    if (App.mode === 'guest') {
      if (Net.state !== 'connected') return {text: Net.note || `Lost the connection to ${host}. Reconnecting…`, actions: [['Practice board', backToSolo]]};
      if (v && v.result && !App.ui.preview) {
        if (v.asked) return {text: `You asked for a rematch. ${host} starts it.`};
        return {text: `Game over. ${host} starts the rematch.`, actions: [['Ask for a rematch', askRematch, true]]};
      }
      return null;
    }
    if (Net.state === 'connected') return {text: `You’re at ${host}’s table. They’ll start the game.`};
    return null;
  },
  overActions(add, v) {
    if (App.mode !== 'guest') return;
    if (Net.state === 'connected' && !v.asked) add('Ask for a rematch', askRematch, true);
    const r = v.review;
    if (r && r.items) add('Your game review', () => openReview('me'));
    else if (r && r.pending) add(`Reviewing… ${r.progress}%`, () => {}, false, true);
  },
  overNote() { return App.mode === 'guest' ? `${App.guest.hostName} starts the rematch.` : ''; },
  reviewSets() {
    const v = App.guest.view;
    if (App.mode !== 'guest' || !v || !v.review || !v.review.items) return [];
    return [{key: 'me', label: 'Your moves', title: 'Your moves', items: v.review.items}];
  },
  hasPeople() { return Net.state === 'connected'; },
  react(e) { Kit.showReaction(e, 'You'); Role.send({type: 'react', e}); },
  marks() { return {arrows: [], hang: [], hint: null}; },
  extra() {
    const joinVisible = App.mode !== 'guest' && Net.state !== 'connected';
    $('join').hidden = !joinVisible;
    const btn = $('join-btn');
    btn.disabled = Net.state === 'connecting';
    btn.textContent = Net.state === 'connecting' ? 'Joining…' : Net.state === 'nohost' || Net.state === 'lost' ? 'Try again' : 'Join';
    $('join-note').textContent = Net.state === 'connecting' ? 'Connecting…' : Net.note || 'Until then, the board below is free to practice on.';
  },
  wake() { Net.link && Net.link.wake(); },
  escape() { return false; },
  closeAll() {}
};

// ---------- rendering ----------
function render() {
  const v = currentView();
  renderTop(v);
  renderBanner(v);
  Role.extra(v);
  renderBars(v);
  renderBoard(v);
  renderStatus(v);
  renderControls(v);
  renderMoves(v);
  renderOver(v);
  $('react-bar').hidden = !Role.hasPeople();
  turnAlerts(v);
}
function turnAlerts(v) {
  const online = App.mode === 'host' || App.mode === 'guest';
  const mine = !!v && online && !v.result && !v.previewing && v.turn === v.me && interactive();
  if (mine && !App.ui.myTurnKey) Kit.alertTurn();
  App.ui.myTurnKey = mine ? v.gid : '';
}
const fmtScore = x => (Math.floor(x) || (x % 1 ? '' : '0')) + (x % 1 ? '½' : '');
function renderTop(v) {
  const scoreEl = $('score');
  scoreEl.hidden = !v || v.free;
  if (v && !v.free) {
    const sc = v.sc || [0, 0];
    scoreEl.innerHTML = `<span>You</span><b>${fmtScore(Number(sc[0]) || 0)}</b><span>–</span><b>${fmtScore(Number(sc[1]) || 0)}</b><span>${esc(oppName(v))}</span>`;
  }
  const p = Role.pill();
  $('pill').classList.toggle('on', p.on);
  $('pill-text').textContent = p.text;
}
function offerBanner(v) {
  if (!v || v.result || v.offer !== 'op' || !interactive()) return null;
  return {text: `${oppName(v)} offers a draw.`, actions: [['Accept draw', () => doAction({t: 'draw'}), true], ['Decline', () => doAction({t: 'decline'})]]};
}
function renderBanner(v) {
  const b = offerBanner(v) || Role.banner(v);
  const key = b ? b.text + '|' + Net.code + '|' + (b.actions || []).map(a => a[0]).join('|') : '';
  if (key === App.ui.bannerKey) return;
  App.ui.bannerKey = key;
  $('banner').hidden = !b;
  if (!b) return;
  $('banner-text').innerHTML = esc(b.text).replace('{code}', `<b class="code">${esc(Net.code)}</b>`);
  const box = $('banner-actions');
  box.innerHTML = '';
  for (const [label, fn, primary] of b.actions || []) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn small' + (primary ? ' primary' : '');
    btn.textContent = label;
    btn.addEventListener('click', fn);
    box.append(btn);
  }
}

function renderBars(v) {
  const me = v ? v.me : 'b', op = otherColor(me);
  $('me-name').textContent = v && v.free ? COLOR_NAME[me] : 'You';
  $('op-name').textContent = oppName(v);
  $('me-chip').className = 'chip ' + me;
  $('op-chip').className = 'chip ' + op;
  $('me-bar').classList.toggle('turn', !!v && !v.result && v.turn === me);
  $('op-bar').classList.toggle('turn', !!v && !v.result && v.turn === op);
  const board = v ? v.board : CK.toStr(CK.START);
  const left = c => [...board].filter(ch => ch.toLowerCase() === c).length;
  const taken = c => 12 - left(c);
  const caps = (c, n) => `<span class="tiny ${c}"></span>`.repeat(Math.max(0, n));
  const diff = left(me) - left(op);
  $('me-caps').innerHTML = caps(op, taken(op)) + (diff > 0 ? `<span class="adv">+${diff}</span>` : '');
  $('op-caps').innerHTML = caps(me, taken(me)) + (diff < 0 ? `<span class="adv">+${-diff}</span>` : '');
  renderClocks(v);
}
function fmtClock(ms) {
  if (ms == null) return '';
  if (ms < 10000) return (ms / 1000).toFixed(1);
  const s = Math.ceil(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function renderClocks(v) {
  const has = !!(v && v.clock);
  for (const side of ['me', 'op']) {
    const el = $(side + '-clock');
    el.hidden = !has;
    if (!has) continue;
    const color = side === 'me' ? v.me : otherColor(v.me);
    const running = v.clock.run === color;
    const ms = Math.max(0, (Number(v.clock[color]) || 0) - (running ? Date.now() - (v.at || Date.now()) : 0));
    el.textContent = fmtClock(ms);
    el.classList.toggle('run', running);
    el.classList.toggle('low', running && ms < 20000);
  }
}

// Black starts at the top of the board data; whoever you are sits at the bottom of the screen.
const flipFor = me => me === 'b';
function displayPos(flip, sq) { const r = sq >> 3, c = sq & 7; return flip ? {dr: 7 - r, dc: 7 - c} : {dr: r, dc: c}; }
function pathArrows(path, kind) {
  const out = [];
  for (let i = 1; i < path.length; i++) out.push({from: path[i - 1], to: path[i], kind, first: i === 1, end: i === path.length - 1});
  return out;
}
function arrowSVG(flip, arrows) {
  let out = '';
  for (const a of arrows) {
    const p = displayPos(flip, a.from), q = displayPos(flip, a.to);
    const x1 = p.dc + 0.5, y1 = p.dr + 0.5, x2 = q.dc + 0.5, y2 = q.dr + 0.5;
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
    const tipX = x2 - ux * 0.12, tipY = y2 - uy * 0.12, baseX = tipX - ux * 0.38, baseY = tipY - uy * 0.38;
    const px = -uy * 0.24, py = ux * 0.24;
    const endX = a.end ? baseX : x2, endY = a.end ? baseY : y2;
    out += `<g class="${a.kind}"><line x1="${(x1 + ux * (a.first ? 0.2 : 0)).toFixed(3)}" y1="${(y1 + uy * (a.first ? 0.2 : 0)).toFixed(3)}" x2="${endX.toFixed(3)}" y2="${endY.toFixed(3)}"/>` +
      (a.end ? `<polygon points="${tipX.toFixed(3)},${tipY.toFixed(3)} ${(baseX + px).toFixed(3)},${(baseY + py).toFixed(3)} ${(baseX - px).toFixed(3)},${(baseY - py).toFixed(3)}"/>` : '') + '</g>';
  }
  return out ? `<svg class="arrows" viewBox="0 0 8 8" aria-hidden="true">${out}</svg>` : '';
}
function previewMarks() {
  const it = App.ui.preview.item;
  return {arrows: [...(it.played ? pathArrows(it.played, 'threat') : []), ...(it.best ? pathArrows(it.best, 'best') : [])], hang: [], hint: null};
}
function selectionTargets(v, b) {
  if (App.ui.sel == null || !v) return {targets: [], trail: []};
  const prefix = [App.ui.sel, ...App.ui.path];
  const cands = CK.moves(b, sideOf(v.turn)).filter(m => prefix.every((x, i) => m.path[i] === x));
  return {targets: [...new Set(cands.map(m => m.path[prefix.length]).filter(x => x != null))], trail: App.ui.path};
}
function renderBoard(v) {
  const boardStr = v ? v.board : CK.toStr(CK.START);
  const b = CK.fromStr(boardStr);
  const me = v ? v.me : 'b';
  const flip = flipFor(me);
  const last = v ? v.last : null;
  const marks = v && v.previewing ? previewMarks() : Role.marks(v, b);
  const {targets, trail} = selectionTargets(v, b);
  const legal = v && !v.result ? CK.moves(b, sideOf(v.turn)) : [];
  const mustJump = canMove(v) && App.ui.sel == null && legal.length && legal[0].caps.length ? new Set(legal.map(m => m.path[0])) : new Set();
  const key = [boardStr, flip, App.ui.sel, trail.join(), targets.join(), last && last.join(), JSON.stringify(marks), [...mustJump].join()].join('|');
  if (key === App.ui.boardKey) return;
  App.ui.boardKey = key;
  const animKey = (v ? v.gid : '') + (last ? last.join() : '') + boardStr;
  const animate = last && App.ui.animKey && App.ui.animKey !== animKey && !(v && v.previewing);
  if (!(v && v.previewing)) App.ui.animKey = animKey;
  if (animate && v.hist.length) Kit.play(v.hist[v.hist.length - 1].includes('x') ? 'capture' : 'move');
  const hang = new Set(marks.hang), lastSet = new Set(last ? [last[0], last[last.length - 1]] : []);
  const trailSet = new Set(trail), targetSet = new Set(targets);
  let html = '';
  for (let dr = 0; dr < 8; dr++) {
    for (let dc = 0; dc < 8; dc++) {
      const r = flip ? 7 - dr : dr, c = flip ? 7 - dc : dc;
      const sq = r * 8 + c;
      const dark = (r + c) % 2 === 1;
      if (!dark) { html += '<div class="sq" aria-hidden="true"></div>'; continue; }
      const p = b[sq];
      const cls = ['sq', 'dark'];
      if (lastSet.has(sq)) cls.push('last');
      if (App.ui.sel === sq) cls.push('sel');
      if (trailSet.has(sq)) cls.push('trail');
      if (targetSet.has(sq)) cls.push('dot');
      if (mustJump.has(sq)) cls.push('must');
      if (hang.has(sq)) cls.push('hang');
      if (marks.hint === sq) cls.push('hint');
      let inner = `<span class="num">${CK.num(sq)}</span>`;
      if (p) {
        let anim = '', style = '';
        if (animate && last[last.length - 1] === sq) {
          const from = displayPos(flip, last[0]);
          anim = ' anim';
          style = ` style="--dx:${(from.dc - dc) * 100 / 0.78}%;--dy:${(from.dr - dr) * 100 / 0.78}%"`;
        }
        inner += `<span class="disc ${p > 0 ? 'b' : 'r'}${anim}"${style}>${Math.abs(p) === 2 ? CROWN : ''}</span>`;
      }
      const label = `Square ${CK.num(sq)}` + (p ? `, ${p > 0 ? 'black' : 'red'} ${Math.abs(p) === 2 ? 'king' : 'piece'}` : '');
      html += `<button class="${cls.join(' ')}" type="button" data-sq="${sq}" aria-label="${label}">${inner}</button>`;
    }
  }
  $('board').innerHTML = html + arrowSVG(flip, marks.arrows);
}

const REASON = {
  captured: 'by taking every piece', blocked: 'by leaving no moves', resign: 'by resignation', time: 'on time',
  repetition: 'Draw: the same position came up three times', forty: 'Draw: 40 moves each with no capture or advance', agreement: 'Draw agreed'
};
function resultText(v) {
  const r = v.result, opp = oppName(v);
  if (r.win == null) return (REASON[r.why] || 'Draw') + '.';
  if (v.free) {
    const winner = r.win === 'me' ? COLOR_NAME[v.me] : COLOR_NAME[otherColor(v.me)];
    return `${winner} wins ${REASON[r.why] || ''}.`;
  }
  if (r.why === 'resign') return r.win === 'me' ? `${opp} resigned. You win!` : 'You resigned.';
  if (r.why === 'time') return r.win === 'me' ? `${opp} ran out of time. You win!` : 'You ran out of time.';
  if (r.why === 'blocked') return r.win === 'me' ? `${opp} has no moves left. You win!` : 'You have no moves left.';
  return r.win === 'me' ? 'You took every piece. You win!' : `${opp} wins.`;
}
function renderStatus(v) {
  const el = $('status');
  let text = '', wait = false;
  if (!v) text = '';
  else if (v.previewing) { text = 'Reviewing a move'; wait = true; }
  else if (v.result) text = resultText(v);
  else if (App.mode === 'guest' && App.guest.waitN) { text = 'Sending your move…'; wait = true; }
  else if (App.mode === 'guest' && Net.state !== 'connected') { text = 'Reconnecting…'; wait = true; }
  else if (App.ui.path.length) text = 'Keep jumping!';
  else {
    const mine = v.free || v.turn === v.me;
    if (v.free) text = COLOR_NAME[v.turn] + ' to move';
    else if (mine) text = 'Your move';
    else { text = `${oppName(v)} is thinking…`; wait = true; }
    if (mine) {
      const legal = CK.moves(CK.fromStr(v.board), sideOf(v.turn));
      if (legal.length && legal[0].caps.length) text += ' · You must jump';
    }
  }
  el.textContent = text;
  el.classList.toggle('wait', wait);
}
function renderControls(v) {
  const vsPerson = !!v && !v.free && (App.mode === 'host' || App.mode === 'guest');
  const live = !!v && !v.result && !v.previewing;
  const draw = $('btn-draw');
  draw.hidden = !(vsPerson && live);
  draw.disabled = !interactive() || !!(v && v.offer === 'me');
  draw.textContent = v && v.offer === 'me' ? 'Draw offered' : v && v.offer === 'op' ? 'Accept draw' : 'Offer draw';
  const resign = $('btn-resign');
  resign.hidden = !(live && !v.free);
  resign.disabled = !interactive();
  const armed = Date.now() < App.ui.resignArmed;
  resign.classList.toggle('armed', armed);
  resign.textContent = armed ? 'Tap again to resign' : 'Resign';
  $('btn-new').hidden = App.mode !== 'solo';
}
function renderMoves(v) {
  const hist = v ? v.hist : [];
  const key = (v ? v.gid : '') + hist.length;
  if (key === App.ui.movesKey) return;
  App.ui.movesKey = key;
  const el = $('moves');
  if (!hist.length) { el.innerHTML = '<span>Moves show up here. Black moves first.</span>'; return; }
  let html = '';
  for (let i = 0; i < hist.length; i += 2) {
    html += `<span>${i / 2 + 1}.</span><b${i === hist.length - 1 ? ' class="now"' : ''}>${esc(hist[i])}</b>`;
    if (hist[i + 1]) html += `<b${i + 1 === hist.length - 1 ? ' class="now"' : ''}>${esc(hist[i + 1])}</b>`;
  }
  el.innerHTML = html;
  el.scrollLeft = el.scrollWidth;
}
function renderOver(v) {
  const show = !!(v && v.result && !v.previewing && App.ui.overDismissed !== v.gid && $('review').hidden);
  const el = $('over');
  if (!show) { el.hidden = true; App.ui.overKey = ''; return; }
  const opp = oppName(v);
  const note = Role.overNote();
  const rv = v.review ? JSON.stringify(v.review).length : 0;
  const key = `${v.gid}|${App.mode}|${Role.hasPeople()}|${opp}|${note}|${!!v.asked}|${rv}|${Role.reviewSets().length}|${ROLE === 'host' ? JSON.stringify([Review.state, Review.progress]) : ''}`;
  el.hidden = false;
  if (key === App.ui.overKey) return;
  App.ui.overKey = key;
  if (App.ui.endSound !== v.gid) { App.ui.endSound = v.gid; Kit.play(v.result.win === 'me' ? 'win' : v.result.win ? 'lose' : 'alert'); }
  $('over-title').textContent = resultText(v);
  const sc = v.sc || [0, 0];
  $('over-score').textContent = v.free ? '' : `Score: You ${fmtScore(sc[0])}, ${opp} ${fmtScore(sc[1])}`;
  $('over-score').hidden = !!v.free;
  const noteEl = $('over-note');
  noteEl.hidden = !note;
  noteEl.textContent = note;
  const box = $('over-actions');
  box.innerHTML = '';
  const add = (label, fn, primary, disabled) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn' + (primary ? ' primary' : '');
    b.textContent = label;
    b.disabled = !!disabled;
    b.addEventListener('click', fn);
    box.append(b);
  };
  if (App.mode === 'solo') add('New game', dealSolo, true);
  Role.overActions(add, v);
  add('See the board', () => { App.ui.overDismissed = v.gid; render(); });
}

function closeOverlays() { $('review').hidden = true; Role.closeAll(); }
let toastTimer = 0;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2800);
}

// ---------- input: tap a piece, then tap each square it lands on ----------
$('board').addEventListener('click', e => {
  const btn = e.target.closest('[data-sq]');
  if (!btn) return;
  const sq = Number(btn.dataset.sq);
  const v = currentView();
  if (!v || v.result || v.previewing) return;
  if (!canMove(v)) {
    if (!interactive()) return;
    toast(`It’s ${oppName(v)}’s move.`);
    return;
  }
  const b = CK.fromStr(v.board);
  const legal = CK.moves(b, sideOf(v.turn));
  if (App.ui.sel != null) {
    const prefix = [App.ui.sel, ...App.ui.path];
    const next = legal.filter(m => prefix.every((x, i) => m.path[i] === x) && m.path[prefix.length] === sq);
    if (next.length) {
      App.ui.path.push(sq);
      const done = next.find(m => m.path.length === prefix.length + 1);
      if (done) { clearSelection(); doAction({t: 'move', path: done.path}); render(); return; }
      render();
      return;
    }
    if (App.ui.path.length) { toast('Keep jumping: tap the next square.'); return; }
  }
  const p = b[sq];
  if (p && Math.sign(p) === sideOf(v.turn) && App.ui.sel !== sq) {
    if (!legal.some(m => m.path[0] === sq)) {
      toast(legal.length && legal[0].caps.length ? 'You have to jump with a glowing piece.' : 'That piece can’t move.');
      clearSelection();
    } else { App.ui.sel = sq; App.ui.path = []; }
  } else clearSelection();
  render();
});
$('btn-draw').addEventListener('click', () => doAction({t: 'draw'}));
$('btn-resign').addEventListener('click', () => {
  if (Date.now() < App.ui.resignArmed) { App.ui.resignArmed = 0; doAction({t: 'resign'}); return; }
  App.ui.resignArmed = Date.now() + 3000;
  render();
  setTimeout(render, 3050);
});
$('btn-new').addEventListener('click', dealSolo);
Kit.muteButton($('mute'));
Kit.reactionBar($('react-bar'), e => Role.react(e));
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('review').hidden) { $('review').hidden = true; render(); return; }
  if (App.ui.preview) { endPreview(); return; }
  if (Role.escape()) return;
  if (App.ui.sel != null) { clearSelection(); render(); }
});

// Clocks tick on screen; the page that runs the game also calls time when a flag falls.
setInterval(() => {
  const v = currentView();
  if (v && v.clock && v.clock.run) renderClocks(v);
  for (const ctx of [App.solo, App.host]) if (ctx && ctx.s && tickClock(ctx.s)) afterChange();
}, 200);

// ---------- boot ----------
(function start() {
  const saved = store.get(SAVE_KEY, null);
  if (saved && saved.settings) App.settings = {...App.settings, ...saved.settings};
  App.solo = saved && saved.solo && saved.solo.s ? saved.solo : {s: null, score: {A: 0, B: 0}, nextColor: 'b', scored: null};
  const h = saved && saved.host;
  App.host = {
    s: h && h.s ? h.s : null, score: (h && h.score) || {A: 0, B: 0}, nextColor: (h && h.nextColor) || 'b',
    guestName: (h && h.guestName) || '', guestDev: (h && h.guestDev) || null, lastN: (h && h.lastN) || {}, scored: (h && h.scored) || null,
    here: false, ack: null, rematchAsk: false
  };
  Role.start(saved);
  if (!App.solo.s) App.solo.s = newCheckersGame({colorA: soloIsFree() ? 'b' : pickColor(App.solo)});
  render();
  Role.after();
})();

</script>
</body>
</html>
