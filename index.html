<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wild Draw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Bungee&display=swap">
<style>
:root {
  /* Layout: one-screen card table. Header + notice, opponent's fan, the felt (status · piles · log), your fan, action bar.
     A single dark "game night" look on purpose; the felt's rim glows in whatever color is in play. */
  --ink: #141117;
  --felt: #241e29;
  --felt-hi: #322939;
  --panel: #211c26;
  --panel-2: #2b2531;
  --line: #3d3546;
  --paper: #f5efe3;
  --muted: #aea2b6;
  --red: #e2463c;    --red-d: #8c1f18;
  --yellow: #f1bb2a; --yellow-d: #8a5c00;
  --green: #2f9d58;  --green-d: #13562b;
  --blue: #2f6ad1;   --blue-d: #163a80;
  --wild: #19161c;   --wild-d: #000000;
  --on-yellow: #2a1d00;
  --play: var(--red);
  --font-display: "Bungee", "Arial Black", "Helvetica Neue", Impact, sans-serif;
  --font-ui: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --cw: 74px; --ch: 111px;
  --ocw: 38px; --och: 57px;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--paper);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.4;
}
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }

.app {
  box-sizing: border-box;
  min-height: 100%;
  max-width: 1040px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-block: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- header ---------- */
.top { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 20px; letter-spacing: .02em; }
.gem { width: 13px; height: 13px; border-radius: 3px; transform: rotate(45deg);
  background: conic-gradient(var(--red) 0 25%, var(--yellow) 0 50%, var(--green) 0 75%, var(--blue) 0); }
.score { display: flex; align-items: baseline; gap: 8px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 0; }
.score b { font-family: var(--font-display); font-weight: 400; font-size: 18px; color: var(--paper); }
.score .dash { color: var(--line); }
.top-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.pill i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); box-sizing: border-box; }
.pill.on { color: var(--paper); }
.pill.on i { background: var(--green); border-color: var(--green); }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); cursor: pointer; padding: 0; }
.icon-btn:hover { background: var(--panel-2); }
.icon-btn svg { width: 18px; height: 18px; }

/* ---------- buttons ---------- */
.btn { font-weight: 600; font-size: 15px; padding: 10px 18px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--panel); color: var(--paper); cursor: pointer; transition: background .15s, transform .1s; }
.btn:hover:not(:disabled) { background: var(--panel-2); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .38; cursor: not-allowed; }
.btn.primary { background: var(--paper); border-color: var(--paper); color: var(--ink); }
.btn.primary:hover:not(:disabled) { background: #fff; }
.btn.small { font-size: 13px; padding: 6px 12px; }
.btn.uno { font-family: var(--font-display); font-weight: 400; font-size: 18px; letter-spacing: .04em; padding: 9px 24px; background: var(--paper); border-color: var(--paper); color: var(--ink); }
.btn.uno:hover:not(:disabled) { background: #fff; }
.btn.uno.armed { background: var(--play); border-color: var(--play); color: var(--paper); opacity: 1; }
.btn.uno.alert { animation: pulse 1s ease-in-out infinite; }
.btn.catch { background: var(--yellow); border-color: var(--yellow); color: var(--on-yellow); }
.btn.catch:hover:not(:disabled) { background: #f6c94a; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--paper) 55%, transparent); }
  50% { box-shadow: 0 0 0 9px color-mix(in srgb, var(--paper) 0%, transparent); transform: scale(1.05); }
}

/* ---------- notice + join ---------- */
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 12px 10px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
.banner p { margin: 0; flex: 1 1 280px; min-width: 0; text-wrap: pretty; }
.banner-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.code { font-family: var(--font-display); font-weight: 400; letter-spacing: .14em; padding: 2px 8px; border-radius: 6px; background: var(--ink); color: var(--paper); white-space: nowrap; }
.join { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 14px; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
.join-copy { flex: 1 1 100%; }
.join h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 20px; }
.join-copy p { margin: 4px 0 0; color: var(--muted); }
.join label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); flex: 1 1 150px; min-width: 0; }
.field-input { box-sizing: border-box; width: 100%; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--ink); color: var(--paper); font-weight: 600; font-size: 16px; }
.field-input:focus { border-color: var(--paper); outline: none; }
#join-code { font-family: var(--font-display); font-weight: 400; letter-spacing: .2em; text-transform: uppercase; }
.join-note { flex-basis: 100%; margin: 0; min-height: 18px; font-size: 13px; color: var(--muted); }

/* ---------- seats ---------- */
.seat { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
.who { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.who strong { color: var(--paper); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.who strong::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line); transition: background .3s, box-shadow .3s; }
.seat.active .who strong::before { background: var(--play); box-shadow: 0 0 0 4px color-mix(in srgb, var(--play) 30%, transparent); }
.count { font-variant-numeric: tabular-nums; }
.badge { font-family: var(--font-display); font-size: 11px; letter-spacing: .05em; padding: 3px 8px; border-radius: 6px; background: var(--paper); color: var(--ink); }
.badge.warn { background: var(--yellow); color: var(--on-yellow); }
.opp-hand { display: flex; justify-content: center; align-items: center; min-height: var(--och); }
.opp-hand .card { --cw: var(--ocw); --ch: var(--och); }
.opp-hand .card + .card { margin-left: calc(var(--ocw) * -0.55); }
.opp-hand .more { margin-left: 10px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

/* ---------- felt ---------- */
.felt {
  position: relative;
  flex: 1 1 auto;
  min-height: 190px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  grid-template-areas: "status piles log";
  align-items: center;
  gap: 16px 32px;
  padding: 22px 26px 34px;
  border-radius: 28px;
  background: radial-gradient(120% 100% at 50% 40%, var(--felt-hi), var(--felt) 55%, var(--ink) 135%);
  box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--play) 65%, transparent),
              inset 0 0 70px -24px color-mix(in srgb, var(--play) 55%, transparent);
  transition: box-shadow .5s ease;
}
.status { grid-area: status; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; min-width: 0; }
.turn { font-family: var(--font-display); font-size: 24px; line-height: 1.1; text-wrap: balance; }
.turn.wait { color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 6px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 55%, transparent); font-size: 13px; color: var(--muted); }
.chip i { width: 18px; height: 18px; border-radius: 50%; background: var(--play); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--paper) 70%, transparent); transition: background .3s; }
.chip b { color: var(--paper); font-weight: 600; }
.pending { font-family: var(--font-display); font-size: 15px; padding: 4px 12px; border-radius: 8px; background: var(--play); color: var(--paper); }
.piles { grid-area: piles; display: flex; align-items: center; gap: 30px; }
.draw-pile { position: relative; width: var(--cw); height: var(--ch); padding: 0; border: 0; background: none; border-radius: 12px; cursor: pointer; }
.draw-pile:disabled { cursor: default; }
.draw-pile .card { position: absolute; inset: 0; }
.draw-pile .l3 { transform: translate(-6px, 6px); }
.draw-pile .l2 { transform: translate(-3px, 3px); }
.draw-pile.ready .l1 { box-shadow: 0 0 0 3px var(--paper), 0 12px 26px -8px rgba(0, 0, 0, .7); }
.draw-pile.ready:hover .l1 { transform: translateY(-5px); }
.pile-count { position: absolute; left: 50%; bottom: -24px; transform: translateX(-50%); font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.discard { position: relative; width: var(--cw); height: var(--ch); }
.discard .card { position: absolute; inset: 0; }
.discard .under { filter: brightness(.7); }
.log { grid-area: log; justify-self: end; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; max-width: 250px; text-align: right; font-size: 13px; color: var(--muted); min-width: 0; }
.log li:first-child { color: var(--paper); }

/* ---------- your hand ---------- */
.hand { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 22px; min-height: var(--ch); }
.hand-row { display: flex; justify-content: center; }
.hand-row > .card + .card { margin-left: var(--ov, 6px); }
.hand .empty { margin: 0; color: var(--muted); align-self: center; }

/* ---------- actions ---------- */
.actions { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; }
.hint { flex-basis: 100%; margin: 0; min-height: 20px; text-align: center; font-size: 13px; color: var(--muted); text-wrap: balance; }

/* ---------- cards ---------- */
.card {
  --cc: var(--wild); --cd: var(--wild-d);
  position: relative;
  flex: none;
  box-sizing: border-box;
  width: var(--cw);
  height: var(--ch);
  margin: 0;
  padding: 0;
  display: grid;
  place-items: center;
  border-radius: calc(var(--cw) * .13);
  border: calc(var(--cw) * .05) solid var(--paper);
  background-color: var(--cc);
  background-image: radial-gradient(rgba(255, 255, 255, .13) 1px, transparent 1.5px);
  background-size: 6px 6px;
  color: var(--paper);
  font-family: var(--font-display);
  font-weight: 400;
  box-shadow: 0 1px 0 rgba(0, 0, 0, .45), 0 8px 16px -6px rgba(0, 0, 0, .65);
  transition: transform .16s ease, filter .2s ease;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.c-R { --cc: var(--red); --cd: var(--red-d); }
.c-Y { --cc: var(--yellow); --cd: var(--yellow-d); }
.c-G { --cc: var(--green); --cd: var(--green-d); }
.c-B { --cc: var(--blue); --cd: var(--blue-d); }
.c-W { --cc: var(--wild); --cd: var(--wild-d); }
.card .face { position: relative; display: grid; place-items: center; font-size: calc(var(--cw) * .56); line-height: 1; text-shadow: calc(var(--cw) * .045) calc(var(--cw) * .045) 0 var(--cd); }
.card .f-sm { font-size: calc(var(--cw) * .4); }
.card .face svg { width: calc(var(--cw) * .52); height: calc(var(--cw) * .52); filter: drop-shadow(calc(var(--cw) * .035) calc(var(--cw) * .035) 0 var(--cd)); }
.card .f-w4 .wheel { position: absolute; inset: 50% auto auto 50%; transform: translate(-50%, -50%); opacity: .9; }
.card .f-w4 .wheel svg { width: calc(var(--cw) * .62); height: calc(var(--cw) * .62); filter: none; }
.card .f-w4 .plus { position: relative; font-size: calc(var(--cw) * .36); text-shadow: 0 0 calc(var(--cw) * .05) #000, calc(var(--cw) * .03) calc(var(--cw) * .03) 0 #000; }
.card .ul { text-decoration: underline; text-decoration-thickness: .07em; text-underline-offset: .06em; }
.card .idx { position: absolute; font-size: calc(var(--cw) * .17); line-height: 1; text-shadow: 1px 1px 0 var(--cd); }
.card .idx svg { width: calc(var(--cw) * .19); height: calc(var(--cw) * .19); display: block; }
.card .tl { top: 6%; left: 9%; }
.card .br { bottom: 6%; right: 9%; transform: rotate(180deg); }
.card.back { background-color: var(--wild); background-image: repeating-linear-gradient(45deg, rgba(255, 255, 255, .05) 0 2px, transparent 2px 7px); background-size: auto; }
.card.back::after { content: ""; position: absolute; left: 17%; right: 17%; top: 31%; bottom: 31%; border-radius: 3px;
  background: linear-gradient(90deg, var(--red) 0 25%, var(--yellow) 25% 50%, var(--green) 50% 75%, var(--blue) 75%); transform: skewY(-16deg); }
.hand .card { cursor: default; }
.hand .card.playable { transform: translateY(-14px); cursor: pointer; }
.hand .card.playable:hover, .hand .card.playable:focus-visible { transform: translateY(-22px); z-index: 2; }
.hand .card.blocked { filter: saturate(.45) brightness(.62); }
.card.enter { animation: deal .3s cubic-bezier(.2, .8, .3, 1) both; }
.discard .top.enter { animation: land .34s cubic-bezier(.2, .8, .3, 1) both; }
@keyframes deal { from { transform: translateY(-28px) scale(.92); opacity: 0; } }
@keyframes land { from { transform: translate(-30px, -56px) rotate(-24deg) scale(1.12); opacity: 0; } }

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(12, 9, 14, .74);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dialog { box-sizing: border-box; width: min(420px, 100%); padding: 24px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .7); display: flex; flex-direction: column; gap: 14px; }
.dialog h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.1; text-wrap: balance; }
.dialog p { margin: 0; color: var(--muted); }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sw { height: 72px; border-radius: 14px; border: 3px solid var(--paper); background: var(--cc); font-family: var(--font-display); font-size: 16px; color: var(--paper); cursor: pointer; text-shadow: 2px 2px 0 var(--cd); }
.sw.c-Y { color: var(--on-yellow); text-shadow: none; }
.sw:hover { transform: translateY(-2px); }


.toast { position: fixed; z-index: 40; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  max-width: calc(100% - 32px); box-sizing: border-box; padding: 9px 16px; border-radius: 12px; background: var(--paper); color: var(--ink); font-weight: 600; font-size: 14px; text-align: center; box-shadow: 0 12px 30px -10px rgba(0, 0, 0, .7); }

/* ---------- narrow screens ---------- */
@media (max-width: 720px) {
  .felt { grid-template-columns: minmax(0, 1fr); grid-template-areas: "piles" "status" "log"; justify-items: center; text-align: center; gap: 14px; padding: 20px 14px 16px; }
  .piles { margin-bottom: 18px; }
  .status { align-items: center; }
  .log { justify-self: center; text-align: center; max-width: none; }
  .log li:nth-child(n + 3) { display: none; }
}
@media (max-width: 560px) {
  :root { --cw: 56px; --ch: 84px; --ocw: 28px; --och: 42px; }
  .brand { font-size: 17px; }
  .turn { font-size: 19px; }
  .app { gap: 10px; }
  .btn { padding: 9px 15px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="gem" aria-hidden="true"></span>Wild Draw</div>
    <div class="score" id="score" aria-label="Score"></div>
    <div class="top-tools">
      <span class="pill" id="pill"><i></i><span id="pill-text"></span></span>
      <button class="btn small" id="btn-new" type="button">New hand</button>

    </div>
  </header>

  <form class="join" id="join" autocomplete="off">
    <div class="join-copy">
      <h2>Join a table</h2>
      <p>Type the 4-letter table code your friend sent you.</p>
    </div>
    <label>Table code<input class="field-input" id="join-code" maxlength="4" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="ABCD"></label>
    <label>Your name<input class="field-input" id="join-name" maxlength="20" placeholder="Name"></label>
    <button class="btn primary" id="join-btn" type="submit">Join</button>
    <p class="join-note" id="join-note" aria-live="polite"></p>
  </form>

  <div class="banner" id="banner" hidden><p id="banner-text"></p><div class="banner-actions" id="banner-actions"></div></div>

  <section class="seat" id="opp-seat" aria-label="Opponent">
    <div class="who"><strong id="opp-name">Computer</strong><span class="count" id="opp-count"></span><span class="badge" id="opp-uno" hidden>UNO</span></div>
    <div class="opp-hand" id="opp-hand"></div>
  </section>

  <section class="felt" aria-label="Table">
    <div class="status">
      <div class="turn" id="turn" aria-live="polite"></div>
      <div class="chip"><i></i><span>Color in play</span><b id="color-name"></b></div>
      <div class="pending" id="pending" hidden></div>
    </div>
    <div class="piles">
      <button class="draw-pile" id="draw-pile" type="button" aria-label="Draw a card">
        <span class="card back l3"></span><span class="card back l2"></span><span class="card back l1"></span>
        <span class="pile-count" id="pile-count"></span>
      </button>
      <div class="discard" id="discard" aria-label="Discard pile"></div>
    </div>
    <ol class="log" id="log" aria-label="Recent moves"></ol>
  </section>

  <section class="seat" id="me-seat" aria-label="Your hand">
    <div class="hand" id="hand"></div>
    <div class="who"><strong>You</strong><span class="count" id="me-count"></span></div>
  </section>

  <div class="actions">
    <button class="btn" id="btn-draw" type="button">Draw</button>
    <button class="btn primary" id="btn-keep" type="button" hidden>Keep it</button>
    <button class="btn uno" id="btn-uno" type="button">UNO!</button>
    <button class="btn catch" id="btn-catch" type="button" hidden>Catch</button>
    <p class="hint" id="hint" aria-live="polite"></p>
  </div>
</div>

<div class="overlay" id="picker" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="picker-title">
    <h2 id="picker-title">Pick a color</h2>
    <div class="swatches" id="swatches">
      <button class="sw c-R" type="button" data-col="R">Red</button>
      <button class="sw c-Y" type="button" data-col="Y">Yellow</button>
      <button class="sw c-G" type="button" data-col="G">Green</button>
      <button class="sw c-B" type="button" data-col="B">Blue</button>
    </div>
    <div class="row"><button class="btn" id="picker-cancel" type="button">Cancel</button></div>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="over-title">
    <p class="eyebrow">Hand over</p>
    <h2 id="over-title"></h2>
    <p id="over-score"></p>
    <p id="over-note" hidden></p>
    <div class="row" id="over-actions"></div>
  </div>

<script>
// <engine>
const COLORS = ['R', 'Y', 'G', 'B'];
const COLOR_NAME = {R: 'Red', Y: 'Yellow', G: 'Green', B: 'Blue'};
const TYPES = ['num', 'skip', 'rev', 'd2', 'wild', 'w4'];
const BASE = {num: 76, skip: 8, rev: 8, d2: 8, wild: 4, w4: 4};
const VALUE_NAME = {S: 'Skip', R: 'Reverse', D: 'Draw Two', W: 'Wild', W4: 'Wild Draw Four'};

const other = seat => (seat === 'A' ? 'B' : 'A');
const rid = () => Math.random().toString(36).slice(2, 10);

function buildDeck() {
  const deck = [];
  let id = 0;
  for (const c of COLORS) {
    deck.push({id: id++, c, v: '0'});
    for (let k = 0; k < 2; k++) {
      for (let n = 1; n <= 9; n++) deck.push({id: id++, c, v: String(n)});
      for (const v of ['S', 'R', 'D']) deck.push({id: id++, c, v});
    }
  }
  for (let k = 0; k < 4; k++) {
    deck.push({id: id++, c: 'W', v: 'W'});
    deck.push({id: id++, c: 'W', v: 'W4'});
  }
  return deck;
}

function typeOf(card) {
  return {S: 'skip', R: 'rev', D: 'd2', W: 'wild', W4: 'w4'}[card.v] || 'num';
}
function code(card) { return card.c + card.v + ':' + card.id; }
function decode(str) {

  const wild = m[2] === 'W' || m[2] === 'W4';
  if ((m[1] === 'W') !== wild) return null;
  return {id: Number(m[3]), c: m[1], v: m[2]};
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function weightedPick(pool, weight) {
  let total = 0;
  const ws = pool.map(c => { const x = Math.max(0, weight(c)); total += x; return x; });
  if (total <= 0) return pool[Math.floor(Math.random() * pool.length)];
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) { r -= ws[i]; if (r < 0) return pool[i]; }
  return pool[pool.length - 1];
}

function topCard(s) { return s.discard[s.discard.length - 1]; }
function matches(s, card) { return card.c === 'W' || card.c === s.color || card.v === topCard(s).v; }
function canPlay(s, seat, card) {
  if (s.win || s.turn !== seat) return false;
  if (s.drawn != null && card.id !== s.drawn) return false;
  if (s.pend > 0) return card.v === 'W4' || (card.v === 'D' && s.pendFrom === 'D');
  return matches(s, card);

  s.log.unshift(e);
  if (s.log.length > 6) s.log.length = 6;

function refill(s) {
  if (s.deck.length || s.discard.length < 2) return;
  const top = s.discard.pop();
  s.deck = shuffle(s.discard);
  s.discard = [top];
  addLog(s, {k: 'shuffle'});

// mode: 'deal' (opening hands), 'turn' (a normal draw on your turn), 'penalty' (+2, +4, caught)
function pickCard(s, seat, mode) {
  refill(s);
  if (!s.deck.length) return null;
  let pool = s.deck;
  let weight = () => 1;
  
  const card = weightedPick(pool, weight);
  s.deck.splice(s.deck.indexOf(card), 1);
  return card;
}
function give(s, seat, n, mode) {
  const got = [];
  for (let i = 0; i < n; i++) {
    const c = pickCard(s, seat, mode);
    if (!c) break;
    s.hands[seat].push(c);
    got.push(c);
  }
  if (s.hands[seat].length > 1) {
    s.called[seat] = false;
    if (s.vul === seat) s.vul = null;
  }
  return got;
}

function newGame({hand = 7, stack = false, first = 'A'} = {}) {
  const s = {
    gid: rid(), seq: 0, deck: shuffle(buildDeck()), discard: [], hands: {A: [], B: []},
    turn: first, color: 'R', pend: 0, pendFrom: null, drawn: null, vul: null, vulAt: 0,
    called: {A: false, B: false}, win: null, log: [], rules: {hand, stack}
  };
  for (let i = 0; i < hand; i++) {
    give(s, first, 1, 'deal');
    give(s, other(first), 1, 'deal');
  }
  const nums = s.deck.filter(c => typeOf(c) === 'num');
  const starter = nums[Math.floor(Math.random() * nums.length)];
  s.deck.splice(s.deck.indexOf(starter), 1);
  s.discard.push(starter);
  s.color = starter.c;
  addLog(s, {k: 'start', w: first});
  return s;

// Two-player rules: Reverse works like Skip; +2/+4 make the other player draw and skip them
// (or, with stacking on, pass the total along until someone can't stack).
function act(s, seat, a) {

  if (!a || s.win) return fail('This hand is over.');
  const opp = other(seat);
  const hand = s.hands[seat];

  if (a.t === 'uno') {
    if (s.vul === seat) { s.vul = null; s.called[seat] = true; }
    else if (hand.length === 2 && s.turn === seat && !s.called[seat]) s.called[seat] = true;
    else return fail('Call UNO when you are down to two cards.');
    addLog(s, {k: 'uno', w: seat});
    s.seq++;
    return {ok: true};
  }
  if (a.t === 'catch') {
    if (s.vul !== opp) return fail('Too late to catch them.');
    s.vul = null;
    give(s, opp, 2, 'penalty');
    addLog(s, {k: 'caught', w: seat});
    s.seq++;
    return {ok: true};
  }
  if (s.turn !== seat) return fail('Wait for your turn.');

  if (a.t === 'draw') {
    if (s.drawn != null) return fail('Play the card you drew or keep it.');
    if (s.vul === opp) s.vul = null;
    if (s.pend > 0) {
      const n = s.pend;
      s.pend = 0;
      s.pendFrom = null;
      give(s, seat, n, 'penalty');
      addLog(s, {k: 'took', w: seat, n});
      s.turn = opp;

      const [c] = give(s, seat, 1, 'turn');
      addLog(s, {k: 'draw', w: seat});
      if (c && canPlay(s, seat, c)) s.drawn = c.id;
      else s.turn = opp;
    }

    return {ok: true};
  }
  if (a.t === 'keep') {
    if (s.drawn == null) return fail('There is no drawn card to keep.');
    s.drawn = null;
    s.turn = opp;
    addLog(s, {k: 'keep', w: seat});
    s.seq++;
    return {ok: true};
  }
  if (a.t === 'play') {
    const card = hand.find(c => c.id === a.id);
    if (!card) return fail('That card is not in your hand.');
    if (!canPlay(s, seat, card)) {
      if (s.drawn != null) return fail('You can only play the card you just drew.');
      if (s.pend > 0) return fail(`Stack a draw card or take +${s.pend}.`);
      return fail(`Play a ${COLOR_NAME[s.color]} card or match the symbol.`);
    }
    if (card.c === 'W' && !COLORS.includes(a.col)) return fail('Pick a color for the wild card.');
    if (s.vul === opp) s.vul = null;
    hand.splice(hand.indexOf(card), 1);
    s.discard.push(card);
    s.drawn = null;
    s.color = card.c === 'W' ? a.col : card.c;
    addLog(s, {k: 'play', w: seat, c: card.c + card.v, col: s.color});
    if (!hand.length) {
      s.win = seat;
      s.vul = null;
      addLog(s, {k: 'win', w: seat});
      s.seq++;
      return {ok: true};
    }
    if (hand.length === 1 && !s.called[seat]) { s.vul = seat; s.vulAt = s.seq; }
    if (card.v === 'S' || card.v === 'R') s.turn = seat;
    else if (card.v === 'D' || card.v === 'W4') {
      const n = card.v === 'D' ? 2 : 4;
      if (s.rules.stack) { s.pend += n; s.pendFrom = card.v; s.turn = opp; }
      else { give(s, opp, n, 'penalty'); addLog(s, {k: 'took', w: opp, n}); s.turn = seat; }
    } else s.turn = opp;
    s.seq++;
    return {ok: true};
  }
  return fail('Unknown move.');
}

// What one seat is allowed to know: its own hand, the other hand's size, and the table.
function toView(s, seat) {
  const rel = w => (w == null ? null : w === seat ? 'me' : 'op');
  const top = topCard(s);
  const prev = s.discard[s.discard.length - 2];
  return {
    gid: s.gid, seq: s.seq,
    me: s.hands[seat].map(code), oc: s.hands[other(seat)].length, pile: s.deck.length,
    top: code(top), prev: prev ? code(prev) : null, col: s.color,
    turn: rel(s.turn), pend: s.pend, pf: s.pendFrom,
    dr: s.turn === seat ? s.drawn : null,
    vul: rel(s.vul), cal: !!s.called[seat], win: rel(s.win),
    log: s.log.slice(0, 4).map(e => ({...e, w: rel(e.w)})),
    rules: s.rules
  };
}
function viewCanPlay(v, card) {
  if (!v || v.win || v.turn !== 'me') return false;
  if (v.dr != null && card.id !== v.dr) return false;
  if (v.pend > 0) return card.v === 'W4' || (card.v === 'D' && v.pf === 'D');
  const top = decode(v.top);
  return card.c === 'W' || card.c === v.col || (!!top && card.v === top.v);
}

function aiColor(hand, except) {
  const n = {R: 0, Y: 0, G: 0, B: 0};
  hand.forEach(c => { if (c !== except && c.c !== 'W') n[c.c]++; });
  let best = COLORS[Math.floor(Math.random() * 4)];
  for (const c of COLORS) if (n[c] > n[best]) best = c;
  return best;
}
function aiChoose(s, seat) {
  if (s.win || s.turn !== seat) return null;
  const hand = s.hands[seat];
  const playable = hand.filter(c => canPlay(s, seat, c));
  const play = c => ({t: 'play', id: c.id, col: c.c === 'W' ? aiColor(hand, c) : undefined});
  if (s.drawn != null) return playable.length ? play(playable[0]) : {t: 'keep'};
  if (!playable.length) return {t: 'draw'};
  const low = s.hands[other(seat)].length <= 2;
  const score = c => {
    const t = typeOf(c);
    let x = {num: 3, skip: 3, rev: 3, d2: 4, wild: 1, w4: 0}[t];
    if (low && t !== 'num') x += 6;
    if (t === 'num') x += Number(c.v) / 10;
    return x + Math.random() * 0.8;

  playable.sort((a, b) => score(b) - score(a));
  return play(playable[0]);
}

  hostName: '',
  guest: {sid: rid(), n: 0, waitN: 0, msg: null, view: null, hostName: 'Host'},
  ui: {pickFor: null, seen: new Set(), seenGid: null, lastTop: null, handKey: '', oppKey: '', bannerKey: '', overKey: '', overDismissed: null}
};
// Connection to the other player. state: off · starting · ready · connecting · connected · nohost · lost · error
const Net = {peer: null, conn: null, state: 'off', code: '', note: '', timer: 0, tries: 0, heard: 0};

// Phones drop connections when the screen locks or the app is switched. Both sides ping every
// few seconds; a link that goes quiet is closed so the normal reconnect path takes over.
setInterval(() => {
  const c = Net.conn;
  if (!c) return;
  if (Date.now() - Net.heard > 14000) { try { c.close(); } catch {} return; }
  if (c.open) { try { c.send({type: 'ping'}); } catch {} }
}, 4000);
function heardFrom(conn) { if (Net.conn === conn) Net.heard = Date.now(); }

let wakeLock = null;
async function keepAwake() {
  try { if (!wakeLock && navigator.wakeLock && document.visibilityState === 'visible') { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch {}
}
document.addEventListener('pointerdown', keepAwake, {passive: true});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  keepAwake();
  Role.wake();
});
function copyText(value, done) {
  try { navigator.clipboard.writeText(value).then(() => toast(done), () => toast(value)); }
  catch { toast(value); }
}

function oppName() {
  if (App.mode === 'host') return App.host.guestName || 'Friend';
  if (App.mode === 'guest') return App.guest.hostName || 'Host';
  return 'Computer';
}

// ---------- state + persistence ----------
function save() {
  const H = App.host;
  store.set(SAVE_KEY, {
    settings: App.settings,
    solo: App.solo,
    host: ROLE === 'host' ? {s: H.s, score: H.score, first: H.first, guestName: H.guestName, lastN: H.lastN, scored: H.scored} : null,
    mode: App.mode === 'guest' ? 'solo' : App.mode
  });
}
function currentView() {
  if (App.mode === 'guest') return App.guest.view;
  const ctx = App.mode === 'host' ? App.host : App.solo;
  if (!ctx.s) return null;
  return {...toView(ctx.s, 'A'), sc: [ctx.score.A, ctx.score.B]};
}
function interactive() {
  if (App.mode !== 'guest') return true;
  return Net.state === 'connected' && !App.guest.waitN;
}
function tallyWins() {
  for (const ctx of [App.solo, App.host]) {
    const s = ctx && ctx.s;
    if (s && s.win && ctx.scored !== s.gid) { ctx.score[s.win]++; ctx.scored = s.gid; }
  }
}
function afterChange() {
  tallyWins();
  save();
  Role.publish();
  render();
  scheduleAI();
}
function dealSolo() {
  const S = App.solo;
  App.mode = 'solo';
  S.s = newGame({...App.settings, first: S.first});
  S.first = other(S.first);
  closeOverlays();
  afterChange();
}
function backToSolo() { App.mode = 'solo'; App.guest.view = null; App.guest.waitN = 0; closeOverlays(); afterChange(); }

function doAction(a) {
  if (App.mode === 'guest') {
    if (!App.guest.view || !interactive()) return;
    Role.send(a);
    return;
  }
  const ctx = App.mode === 'host' ? App.host : App.solo;
  if (!ctx.s) return;
  const r = act(ctx.s, 'A', a);
  if (!r.ok) { toast(r.err); return; }
  afterChange();
}

// ---------- computer opponent ----------
let aiTimer = 0;
let aiCatchKey = null;
function scheduleAI() {
  clearTimeout(aiTimer);
  if (App.mode !== 'solo') return;
  const s = App.solo.s;
  if (!s || s.win) return;
  const live = () => App.mode === 'solo' && App.solo.s === s && !s.win;
  const key = s.gid + ':' + s.vulAt;
  if (s.vul === 'A' && aiCatchKey !== key) {
    aiCatchKey = key;
    aiTimer = setTimeout(() => {
      if (!live()) return;
      if (s.vul === 'A' && Math.random() < 0.65) { act(s, 'B', {t: 'catch'}); afterChange(); }
      else scheduleAI();
    }, 1000 + Math.random() * 1000);
    return;
  }
  if (s.turn !== 'B') return;
  aiTimer = setTimeout(() => {
    if (!live()) return;
    if (s.vul === 'B' && Math.random() < 0.5) act(s, 'B', {t: 'uno'});
    const m = aiChoose(s, 'B');
    if (m && m.t === 'play' && s.hands.B.length === 2 && !s.called.B && Math.random() < 0.85) act(s, 'B', {t: 'uno'});
    if (m) act(s, 'B', m);
    afterChange();
  }, 750 + Math.random() * 700);
}
function cleanAct(a) {
  return {
    t: ['play', 'draw', 'keep', 'uno', 'catch'].includes(a.t) ? a.t : null,
    id: Number.isInteger(a.id) ? a.id : -1,
    col: COLORS.includes(a.col) ? a.col : null
  };
}
function noLibrary() {
  Net.state = 'error';
  Net.note = 'The connection code didn’t load. Reload the page.';
  render();
}


// ================= player: join a friend's table =================
function playerJoin(code) {
  code = String(code || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  if (code.length !== 4) { toast('Table codes are 4 letters.'); return; }
  if (typeof Peer !== 'function') return noLibrary();
  Net.code = code;
  store.set('wilddraw:join', {code, name: App.guest.myName});
  clearTimeout(Net.timer);
  if (Net.peer) { try { Net.peer.destroy(); } catch {} }
  Net.conn = null;
  Net.state = 'connecting';
  Net.note = '';
  render();
  const peer = new Peer(peerOptions());
  Net.peer = peer;
  const giveUp = setTimeout(() => {
    if (Net.peer !== peer || Net.state === 'connected') return;
    Net.state = 'lost';
    Net.note = 'Couldn’t reach the table. Trying again…';
    render();
    rejoinSoon();
  }, 15000);
  peer.on('open', () => {
    if (Net.peer !== peer) return;
    const conn = peer.connect(PREFIX + code, {reliable: true});
    conn.on('open', () => {
      if (Net.peer !== peer) return;
      clearTimeout(giveUp);
      Net.conn = conn;
      Net.heard = Date.now();
      Net.state = 'connected';
      Net.note = '';
      conn.send({type: 'hello', name: App.guest.myName || 'Friend', sid: App.guest.sid});
      if (App.guest.waitN && App.guest.msg) conn.send(App.guest.msg);
      render();
    });
    conn.on('data', msg => { heardFrom(conn); if (Net.conn === conn) playerOnData(msg); });
    conn.on('close', () => {
      if (Net.conn !== conn) return;
      Net.conn = null;
      Net.state = 'lost';
      Net.note = `Lost the connection to ${App.guest.hostName}. Reconnecting…`;
      render();
      rejoinSoon();
    });
    conn.on('error', () => {});
  });
  peer.on('disconnected', () => {
    if (Net.peer === peer && !peer.destroyed && Net.state !== 'connected') rejoinSoon();
  });
  peer.on('error', err => {
    if (Net.peer !== peer) return;
    clearTimeout(giveUp);
    if (err.type === 'peer-unavailable') {
      Net.state = 'nohost';
      Net.note = `No table is open with code ${code} right now. Checking again every few seconds.`;
    } else if (Net.state !== 'connected') {
      Net.state = 'lost';
      Net.note = 'Can’t reach the connection server. Trying again…';
    }
    render();
    if (Net.state !== 'connected') rejoinSoon();
  });
}
function rejoinSoon() {
  clearTimeout(Net.timer);
  Net.timer = setTimeout(() => { if (Net.code && Net.state !== 'connected') playerJoin(Net.code); }, 4000);
}
function playerOnData(msg) {
  if (!msg || typeof msg !== 'object') return;
  const G = App.guest;
  if (msg.type !== 'state') return;
  G.hostName = cleanName(msg.host) || 'Host';
  const g = msg.g;
  if (g && typeof g === 'object' && Array.isArray(g.me) && typeof g.top === 'string') {
    G.view = g;
    const ack = g.ack;
    if (G.waitN && ack && ack.sid === G.sid && ack.n >= G.waitN) {
      if (ack.e) toast(String(ack.e).slice(0, 140));
      G.waitN = 0;
      G.msg = null;
    }
    if (App.mode !== 'guest') { App.mode = 'guest'; closeOverlays(); scheduleAI(); }
  } else if (App.mode === 'guest') {
    App.mode = 'solo';
    G.view = null;
    G.waitN = 0;
  }
  render();
}

$('join').addEventListener('submit', e => {
  e.preventDefault();
  App.guest.myName = cleanName($('join-name').value);
  playerJoin($('join-code').value);
});

const codeFromLink = () => ((location.hash.match(/^#([A-Za-z]{4})$/) || [])[1] || '').toUpperCase();
window.addEventListener('hashchange', () => {
  const code = codeFromLink();
  if (!code || code === Net.code) return;
  $('join-code').value = code;
  if (App.guest.myName) playerJoin(code);
});

const Role = {
  start() {
    const j = store.get('wilddraw:join', null) || {};
    App.guest.myName = cleanName(j.name);
    const code = codeFromLink() || j.code || '';
    $('join-name').value = App.guest.myName;
    $('join-code').value = code;
    if (code && App.guest.myName) playerJoin(code);
    else if (code) Net.note = 'Type your name and tap Join.';
  },
  wake() {
    if (Net.code && Net.state !== 'connected' && Net.state !== 'connecting') { clearTimeout(Net.timer); playerJoin(Net.code); }
  },
  publish() {},
  send(a) {
    const G = App.guest;
    G.n += 1;
    G.waitN = G.n;
    G.msg = {type: 'act', a, n: G.n, g: G.view.gid, sid: G.sid};
    try { Net.conn.send(G.msg); } catch {}
    render();
  },
  pill() {
    const host = App.guest.hostName || 'Host';
    switch (Net.state) {
      case 'connected': return {on: true, text: `${host} is here`};
      case 'connecting': return {on: false, text: 'Connecting…'};
      case 'nohost': return {on: false, text: 'Waiting for the table'};
      case 'lost': return {on: false, text: 'Reconnecting…'};
      case 'error': return {on: false, text: 'Connection problem'};
      default: return {on: false, text: 'Not at a table'};
    }
  },
  banner(v) {
    const host = App.guest.hostName || 'Host';
    if (App.mode === 'guest') {
      if (Net.state !== 'connected') return {text: Net.note || `Lost the connection to ${host}. Reconnecting…`, actions: [['Practice vs computer', backToSolo]]};
      if (v && v.win) return {text: `Hand over. ${host} deals the next one.`};
      return null;
    }
    if (Net.state === 'connected') return {text: `You’re at ${host}’s table. Practice here until they deal you in.`};
    if (v && v.win && App.ui.overDismissed === v.gid) return {text: 'Hand over.', actions: [['Deal again', dealSolo, true]]};
    return null;
  },
  dealAgain() {},
  extra() {
    const joinVisible = App.mode !== 'guest' && Net.state !== 'connected';
    $('join').hidden = !joinVisible;
    const btn = $('join-btn');
    btn.disabled = Net.state === 'connecting';
    btn.textContent = Net.state === 'connecting' ? 'Joining…' : Net.state === 'nohost' || Net.state === 'lost' ? 'Try again' : 'Join';
    $('join-note').textContent = Net.state === 'connecting' ? 'Connecting…' : Net.note || 'Until then, practice against the computer below.';
  },
  escape() { return false; },
  closeAll() {}
};

// ---------- rendering ----------
function cardLabel(card) {
  if (card.c === 'W') return VALUE_NAME[card.v];
  return `${COLOR_NAME[card.c]} ${VALUE_NAME[card.v] || card.v}`;
}
function faceOf(card) {
  switch (card.v) {
    case 'S': return {big: SVG_SKIP, idx: SVG_SKIP, kind: 'icon'};
    case 'R': return {big: SVG_REV, idx: SVG_REV, kind: 'icon'};
    case 'D': return {big: '+2', idx: '+2', kind: 'sm'};
    case 'W': return {big: SVG_WHEEL, idx: 'W', kind: 'icon'};
    case 'W4': return {big: `<span class="wheel">${SVG_WHEEL}</span><span class="plus">+4</span>`, idx: '+4', kind: 'w4'};
    default: return {big: card.v === '6' || card.v === '9' ? `<span class="ul">${card.v}</span>` : card.v, idx: card.v, kind: 'num'};
  }
}
function cardHTML(card, {tag = 'div', cls = '', attrs = '', style = ''} = {}) {
  const f = faceOf(card);
  const role = tag === 'div' ? ' role="img"' : '';
  return `<${tag} class="card c-${card.c} ${cls}"${role} ${attrs} style="${style}" aria-label="${esc(cardLabel(card))}">` +
    `<span class="idx tl" aria-hidden="true">${f.idx}</span><span class="face f-${f.kind}" aria-hidden="true">${f.big}</span><span class="idx br" aria-hidden="true">${f.idx}</span></${tag}>`;
}
const rot = id => ((id * 47) % 15) - 7;
const ORDER_C = {R: 0, Y: 1, G: 2, B: 3, W: 4};
const orderV = v => (/^\d$/.test(v) ? Number(v) : {S: 10, R: 11, D: 12, W: 13, W4: 14}[v]);
function cardName(cv, col) {
  const c = cv[0], v = cv.slice(1);
  const vn = VALUE_NAME[v] || v;
  return c === 'W' ? `${vn} (${COLOR_NAME[col] || '?'})` : `${COLOR_NAME[c] || '?'} ${vn}`;
}
function logText(e, opp) {
  const who = e.w === 'me' ? 'You' : opp;
  switch (e.k) {
    case 'start': return e.w === 'me' ? 'You go first' : `${opp} goes first`;
    case 'play': return `${who} played ${cardName(String(e.c || ''), e.col)}`;
    case 'draw': return `${who} drew a card`;
    case 'took': return `${who} drew ${Number(e.n) || 0}`;
    case 'keep': return `${who} kept the drawn card`;
    case 'uno': return `${who} called UNO!`;
    case 'caught': return e.w === 'me' ? `You caught ${opp} without UNO: +2` : `${opp} caught you without UNO: +2`;
    case 'shuffle': return 'Discards shuffled back into the pile';
    case 'win': return `${who} won the hand`;
    default: return '';
  }
}

function render() {
  const v = currentView();
  const opp = oppName();
  document.documentElement.style.setProperty('--play', `var(--${(v && COLOR_KEY[v.col]) || 'red'})`);
  renderTop(v, opp);
  renderBanner(v);
  Role.extra(v);
  renderOpp(v, opp);
  renderFelt(v, opp);
  renderHand(v);
  renderActions(v, opp);
  renderOver(v, opp);
}

function renderTop(v, opp) {
  const sc = (v && v.sc) || [0, 0];
  $('score').innerHTML = `<span>You</span><b>${Number(sc[0]) || 0}</b><span class="dash">–</span><b>${Number(sc[1]) || 0}</b><span>${esc(opp)}</span>`;
  const p = Role.pill();
  $('pill').classList.toggle('on', p.on);
  $('pill-text').textContent = p.text;
  $('btn-new').hidden = App.mode !== 'solo';
}
function renderBanner(v) {
  const b = Role.banner(v);
  const key = b ? b.text + '|' + Net.code + '|' + (b.actions || []).map(a => a[0]).join('|') : '';
  if (key === App.ui.bannerKey) return;
  App.ui.bannerKey = key;
  $('banner').hidden = !b;
  if (!b) return;
  $('banner-text').innerHTML = esc(b.text).replace('{code}', `<b class="code">${esc(Net.code)}</b>`);
  const box = $('banner-actions');
  box.innerHTML = '';
  for (const [label, fn, primary] of b.actions || []) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn small' + (primary ? ' primary' : '');
    btn.textContent = label;
    btn.addEventListener('click', fn);
    box.append(btn);
  }
}

function renderOpp(v, opp) {
  $('opp-name').textContent = opp;
  const n = v ? Number(v.oc) || 0 : 0;
  $('opp-count').textContent = `${n} card${n === 1 ? '' : 's'}`;
  const badge = $('opp-uno');
  const exposed = !!v && v.vul === 'op';
  badge.hidden = !(v && n === 1 && !v.win);
  badge.textContent = exposed ? 'NO UNO CALL' : 'UNO';
  badge.classList.toggle('warn', exposed);
  $('opp-seat').classList.toggle('active', !!v && v.turn === 'op' && !v.win);
  const key = String(n);
  if (key === App.ui.oppKey) return;
  App.ui.oppKey = key;
  const shown = Math.min(n, 14);
  let html = '';
  for (let i = 0; i < shown; i++) html += '<div class="card back" aria-hidden="true"></div>';
  if (n > shown) html += `<span class="more">+${n - shown}</span>`;
  $('opp-hand').innerHTML = html;
}

function renderFelt(v, opp) {
  const canDraw = !!v && interactive() && v.turn === 'me' && !v.win && v.dr == null;
  const dp = $('draw-pile');
  dp.disabled = !canDraw;
  dp.classList.toggle('ready', canDraw);
  dp.setAttribute('aria-label', v && v.pend > 0 ? `Take +${v.pend}` : 'Draw a card');
  $('pile-count').textContent = v ? `${Number(v.pile) || 0} in pile` : '';

  const topKey = v ? v.top + '|' + v.prev : '';
  if (topKey !== App.ui.lastTop) {
    const isNew = App.ui.lastTop !== null;
    App.ui.lastTop = topKey;
    const top = v && decode(v.top);
    const prev = v && v.prev && decode(v.prev);
    $('discard').innerHTML = (prev ? cardHTML(prev, {cls: 'under', style: `transform: rotate(${rot(prev.id)}deg)`}) : '') +
      (top ? cardHTML(top, {cls: 'top' + (isNew ? ' enter' : ''), style: `transform: rotate(${rot(top.id)}deg)`}) : '');
  }

  let t, wait = false;
  if (!v) t = 'Shuffling…';
  else if (v.win) t = v.win === 'me' ? 'You won the hand' : `${opp} won the hand`;
  else if (App.mode === 'guest' && App.guest.waitN) { t = 'Sending your move…'; wait = true; }
  else if (v.turn === 'me') t = 'Your turn';
  else { t = `${opp}’s turn`; wait = true; }
  $('turn').textContent = t;
  $('turn').classList.toggle('wait', wait);
  $('color-name').textContent = v ? COLOR_NAME[v.col] || '' : '';
  const pend = $('pending');
  pend.hidden = !(v && v.pend > 0);
  if (v && v.pend > 0) pend.textContent = `+${v.pend} waiting`;

  $('log').replaceChildren(...(v && Array.isArray(v.log) ? v.log : []).map(e => {
    const li = document.createElement('li');
    li.textContent = logText(e, opp);
    return li;
  }));
}

function renderHand(v) {
  const el = $('hand');
  const cards = v ? v.me.map(decode).filter(Boolean) : [];
  cards.sort((a, b) => ORDER_C[a.c] - ORDER_C[b.c] || orderV(a.v) - orderV(b.v) || a.id - b.id);
  const live = !!v && interactive() && !v.win;
  const flags = cards.map(c => (live && viewCanPlay(v, c) ? 'p' : live && v.turn === 'me' ? 'b' : 'n'));
  $('me-count').textContent = `${cards.length} card${cards.length === 1 ? '' : 's'}`;
  $('me-seat').classList.toggle('active', !!v && v.turn === 'me' && !v.win);

  const width = el.clientWidth || 600;
  const cw = parseFloat(getComputedStyle(el).getPropertyValue('--cw')) || 74;
  const key = `${v ? v.gid : ''}|${cards.map((c, i) => c.id + flags[i]).join(',')}|${width}|${cw}`;
  if (key === App.ui.handKey) return;
  App.ui.handKey = key;
  if (v && App.ui.seenGid !== v.gid) { App.ui.seen = new Set(); App.ui.seenGid = v.gid; }

  const perRow = Math.max(1, Math.floor((width - cw) / (cw * 0.36)) + 1);
  const rows = Math.max(1, Math.ceil(cards.length / perRow));
  const per = Math.ceil(cards.length / rows);
  let html = '';
  let fresh = 0;
  for (let r = 0; r < rows; r++) {
    const slice = cards.slice(r * per, (r + 1) * per);
    const k = slice.length;
    const ov = k > 1 ? Math.min(6, (width - cw) / (k - 1) - cw) : 0;
    html += `<div class="hand-row" style="--ov:${ov.toFixed(1)}px">` + slice.map(c => {
      const f = flags[cards.indexOf(c)];
      const isNew = !App.ui.seen.has(c.id);
      const cls = (f === 'p' ? 'playable' : f === 'b' ? 'blocked' : '') + (isNew ? ' enter' : '');
      const style = isNew ? `animation-delay:${Math.min(fresh++, 10) * 45}ms` : '';
      return cardHTML(c, {tag: 'button', cls, style, attrs: `type="button" data-id="${c.id}"${f === 'p' ? '' : ' aria-disabled="true"'}`});
    }).join('') + '</div>';
  }
  el.innerHTML = cards.length ? html : '<p class="empty">No cards in hand</p>';
  cards.forEach(c => App.ui.seen.add(c.id));
}

function renderActions(v, opp) {
  const live = !!v && interactive() && !v.win;
  const myTurn = live && v.turn === 'me';
  const hand = v ? v.me.map(decode).filter(Boolean) : [];
  const anyPlayable = myTurn && hand.some(c => viewCanPlay(v, c));
  const draw = $('btn-draw');
  draw.disabled = !(myTurn && v.dr == null);
  draw.textContent = v && v.pend > 0 && v.turn === 'me' ? `Take +${v.pend}` : 'Draw';
  $('btn-keep').hidden = !(myTurn && v.dr != null);

  const uno = $('btn-uno');
  const mustCall = live && v.vul === 'me';
  const canArm = myTurn && hand.length === 2 && !v.cal && anyPlayable;
  const called = !!v && v.cal && hand.length <= 2 && !mustCall && !v.win;
  uno.disabled = !(canArm || mustCall);
  uno.classList.toggle('alert', mustCall);
  uno.classList.toggle('armed', called);
  uno.textContent = called ? 'UNO called' : 'UNO!';

  const catchBtn = $('btn-catch');
  catchBtn.hidden = !(live && v.vul === 'op');
  catchBtn.textContent = `Catch ${opp}: +2`;

  let hint = '';
  if (App.mode === 'guest' && Net.state !== 'connected' && v && !v.win) hint = 'Reconnecting to the table…';
  else if (mustCall) hint = 'You’re on one card and didn’t call UNO. Call it before you get caught.';
  else if (live && v.vul === 'op') hint = `${opp} is on one card and didn’t call UNO.`;
  else if (myTurn && v.dr != null) hint = 'You drew a card you can play. Play it or keep it.';
  else if (myTurn && v.pend > 0) hint = anyPlayable ? `Stack a draw card or take +${v.pend}.` : `Nothing to stack. Take +${v.pend}.`;
  else if (myTurn && !anyPlayable) hint = 'Nothing in your hand matches. Draw a card.';
  else if (canArm) hint = 'Two cards left. Call UNO before you play.';
  $('hint').textContent = hint;
}

function renderOver(v, opp) {
  const show = !!(v && v.win && App.ui.overDismissed !== v.gid);
  const el = $('over');
  if (!show) { el.hidden = true; App.ui.overKey = ''; return; }
  const key = `${v.gid}|${App.mode}|${!!(App.host && App.host.here)}|${opp}`;
  el.hidden = false;
  if (key === App.ui.overKey) return;
  App.ui.overKey = key;
  $('over-title').textContent = v.win === 'me' ? 'You win the hand' : `${opp} wins the hand`;
  $('over-score').textContent = `Score: You ${v.sc[0]}, ${opp} ${v.sc[1]}`;
  const note = $('over-note');
  note.hidden = App.mode !== 'guest';
  note.textContent = `${opp} deals the next hand.`;
  const box = $('over-actions');
  box.innerHTML = '';
  const add = (label, fn, primary) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn' + (primary ? ' primary' : '');
    b.textContent = label;
    b.addEventListener('click', fn);
    box.append(b);
  };
  const close = () => { App.ui.overDismissed = v.gid; render(); };
  if (App.mode === 'solo') add('Deal again', dealSolo, true);
  else if (App.mode === 'host') Role.dealAgain(add);
  add('See the table', close);
  const first = box.querySelector('button');
  if (first) first.focus();
}

function closeOverlays() { $('picker').hidden = true; App.ui.pickFor = null; Role.closeAll(); }

let toastTimer = 0;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2800);
}

// ---------- events ----------
function whyNot(v) {
  if (v.turn !== 'me') return `Wait for ${oppName()}.`;
  if (v.dr != null) return 'You can only play the card you just drew.';
  if (v.pend > 0) return `Stack a draw card or take +${v.pend}.`;
  return `Play a ${COLOR_NAME[v.col]} card or match the symbol.`;
}
$('hand').addEventListener('click', e => {
  const b = e.target.closest('.card[data-id]');
  if (!b) return;
  const v = currentView();
  if (!v || !interactive() || v.win) return;
  const id = Number(b.dataset.id);
  const card = v.me.map(decode).find(c => c && c.id === id);
  if (!card) return;
  if (!viewCanPlay(v, card)) { toast(whyNot(v)); return; }
  if (card.c === 'W') {
    App.ui.pickFor = id;
    $('picker').hidden = false;
    $('swatches').querySelector('button').focus();
    return;
  }
  doAction({t: 'play', id});
});
$('swatches').addEventListener('click', e => {
  const b = e.target.closest('[data-col]');
  if (!b || App.ui.pickFor == null) return;
  const id = App.ui.pickFor;
  $('picker').hidden = true;
  App.ui.pickFor = null;
  doAction({t: 'play', id, col: b.dataset.col});
});
$('picker-cancel').addEventListener('click', () => { $('picker').hidden = true; App.ui.pickFor = null; });
$('draw-pile').addEventListener('click', () => doAction({t: 'draw'}));
$('btn-draw').addEventListener('click', () => doAction({t: 'draw'}));
$('btn-keep').addEventListener('click', () => doAction({t: 'keep'}));
$('btn-uno').addEventListener('click', () => doAction({t: 'uno'}));
$('btn-catch').addEventListener('click', () => doAction({t: 'catch'}));
$('btn-new').addEventListener('click', dealSolo);
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('picker').hidden) { $('picker').hidden = true; App.ui.pickFor = null; return; }
  Role.escape();
});
let resizeTimer = 0;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 80); });

// ---------- boot ----------
(function start() {
  const saved = store.get(SAVE_KEY, null);
  if (saved && saved.settings) App.settings = {...App.settings, ...saved.settings};
  App.solo = saved && saved.solo && saved.solo.s ? saved.solo : {s: null, score: {A: 0, B: 0}, first: 'A', scored: null};
  const h = saved && saved.host;
  App.host = {
    s: h && h.s ? h.s : null, score: (h && h.score) || {A: 0, B: 0}, first: (h && h.first) || 'B',
    guestName: (h && h.guestName) || '', lastN: (h && h.lastN) || {}, scored: (h && h.scored) || null,
    here: false, ack: null
  };
  Role.start(saved);
  if (!App.solo.s) {
    App.solo.s = newGame({...App.settings, first: App.solo.first});
    App.solo.first = other(App.solo.first);
    save();
  }
  render();
  scheduleAI();
})();
</script>
</body>
</html>
