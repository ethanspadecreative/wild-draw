<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Back Rank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Bungee&display=swap">
<style>
:root {
  /* Layout: one centered column built for phones: header, notice, opponent bar, board, your bar, status, controls, moves.
     Same dark game-night look as Wild Draw, with a walnut board. */
  --ink: #141117;
  --panel: #211c26;
  --panel-2: #2b2531;
  --line: #3d3546;
  --paper: #f5efe3;
  --muted: #aea2b6;
  --sq-light: #ebdfc6;
  --sq-dark: #a27c5f;
  --last: rgba(241, 187, 42, .45);
  --sel: rgba(47, 157, 88, .6);
  --dot: rgba(20, 17, 23, .28);
  --red: #e2463c;
  --green: #2f9d58;
  --yellow: #f1bb2a;
  --on-yellow: #2a1d00;
  --font-display: "Bungee", "Arial Black", "Helvetica Neue", Impact, sans-serif;
  --font-ui: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--font-ui); font-size: 15px; line-height: 1.4; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }

.app {
  box-sizing: border-box;
  min-height: 100%;
  max-width: 620px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-block: max(12px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- header ---------- */
.top { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 20px; letter-spacing: .02em; }
.gem { width: 14px; height: 14px; border-radius: 3px;
  background: conic-gradient(var(--sq-dark) 0 25%, var(--sq-light) 0 50%, var(--sq-dark) 0 75%, var(--sq-light) 0); }
.score { display: flex; align-items: baseline; gap: 8px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 0; }
.score b { font-family: var(--font-display); font-weight: 400; font-size: 18px; color: var(--paper); }
.top-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.pill i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); box-sizing: border-box; }
.pill.on { color: var(--paper); }
.pill.on i { background: var(--green); border-color: var(--green); }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); cursor: pointer; padding: 0; }
.icon-btn:hover { background: var(--panel-2); }
.icon-btn svg { width: 18px; height: 18px; }

/* ---------- buttons ---------- */
.btn { font-weight: 600; font-size: 15px; padding: 9px 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--panel); color: var(--paper); cursor: pointer; transition: background .15s, transform .1s; }
.btn:hover:not(:disabled) { background: var(--panel-2); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--paper); border-color: var(--paper); color: var(--ink); }
.btn.primary:hover:not(:disabled) { background: #fff; }
.btn.small { font-size: 13px; padding: 6px 12px; }
.btn.danger { border-color: var(--red); color: #ffb3ad; }
.btn.armed { background: var(--red); border-color: var(--red); color: var(--paper); }

/* ---------- notice + join ---------- */
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 12px 10px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
.banner p { margin: 0; flex: 1 1 240px; min-width: 0; text-wrap: pretty; }
.banner-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.code { font-family: var(--font-display); font-weight: 400; letter-spacing: .14em; padding: 2px 8px; border-radius: 6px; background: var(--ink); color: var(--paper); white-space: nowrap; }
.join { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 14px; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
.join-copy { flex: 1 1 100%; }
.join h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 20px; }
.join-copy p { margin: 4px 0 0; color: var(--muted); }
.join label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); flex: 1 1 150px; min-width: 0; }
.field-input { box-sizing: border-box; width: 100%; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--ink); color: var(--paper); font-weight: 600; font-size: 16px; }
.field-input:focus { border-color: var(--paper); outline: none; }
#join-code { font-family: var(--font-display); font-weight: 400; letter-spacing: .2em; text-transform: uppercase; }
.join-note { flex-basis: 100%; margin: 0; min-height: 18px; font-size: 13px; color: var(--muted); }

/* ---------- player bars ---------- */
.bar { display: flex; align-items: center; gap: 10px; min-height: 40px; min-width: 0; }
.bar .who { display: flex; align-items: center; gap: 8px; min-width: 0; flex: none; max-width: 45%; }
.bar .who strong { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.swatch { width: 14px; height: 14px; border-radius: 4px; flex: none; border: 1.5px solid var(--line); box-sizing: border-box; }
.swatch.w { background: #f4f1ea; }
.swatch.b { background: #1c1a1e; border-color: #5a5060; }
.bar.turn .who strong { color: var(--paper); }
.bar:not(.turn) .who strong { color: var(--muted); }
.caps { display: flex; align-items: center; flex-wrap: wrap; min-width: 0; flex: 1 1 auto; row-gap: 2px; }
.cap { width: 19px; height: 19px; background-size: contain; background-repeat: no-repeat; margin-right: -6px; }
.cap + .cap:not(.same) { margin-left: 6px; }
.adv { margin-left: 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.clock { margin-left: auto; flex: none; font-family: var(--font-display); font-weight: 400; font-size: 17px; font-variant-numeric: tabular-nums;
  padding: 5px 10px; border-radius: 8px; background: var(--panel); color: var(--muted); min-width: 64px; text-align: right; }
.clock.run { background: var(--paper); color: var(--ink); }
.clock.low { background: var(--red); color: var(--paper); }

/* ---------- board ---------- */
.board-wrap { display: flex; gap: 8px; justify-content: center; align-items: stretch; }
.board {
  position: relative;
  flex: none;
  width: min(100%, 560px);
  width: min(100%, 560px, max(280px, calc(100dvh - 330px)));
  aspect-ratio: 1;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 0 0 3px var(--panel-2), 0 20px 40px -20px rgba(0, 0, 0, .8);
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.sq { position: relative; border: 0; border-radius: 0; padding: 0; margin: 0; min-width: 0; appearance: none; -webkit-appearance: none; background: var(--sq-light); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.sq.dark { background: var(--sq-dark); }
.sq.last::before { content: ""; position: absolute; inset: 0; background: var(--last); }
.sq.sel::before { content: ""; position: absolute; inset: 0; background: var(--sel); }
.sq.check { background-image: radial-gradient(circle, rgba(226, 70, 60, .95) 0%, rgba(226, 70, 60, .55) 45%, transparent 72%); }
.sq.dot::after { content: ""; position: absolute; left: 35%; top: 35%; width: 30%; height: 30%; border-radius: 50%; background: var(--dot); z-index: 2; }
.sq.cap::after { content: ""; position: absolute; inset: 4%; border-radius: 50%; box-shadow: inset 0 0 0 5px var(--dot); z-index: 2; }
.sq.hang .pc { filter: drop-shadow(0 0 3px var(--red)) drop-shadow(0 0 2px var(--red)); }
.sq.hint::before { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 4px rgba(47, 157, 88, .9); }
.pc { position: absolute; inset: 3%; background-size: 100% 100%; background-repeat: no-repeat; z-index: 1; pointer-events: none; }
.pc.anim { animation: slide .22s cubic-bezier(.2, .8, .3, 1) both; z-index: 3; }
@keyframes slide { from { transform: translate(var(--dx), var(--dy)); } }
.coord { position: absolute; font-size: 10px; font-weight: 800; line-height: 1; pointer-events: none; z-index: 1; }
.coord.f { right: 4%; bottom: 4%; }
.coord.r { left: 4%; top: 4%; }
.sq.light .coord { color: var(--sq-dark); }
.sq.dark .coord { color: var(--sq-light); }
.arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
.arrows line { stroke-width: .16; stroke-linecap: round; }
.arrows polygon { stroke: none; }
.arrows .best line { stroke: rgba(47, 157, 88, .82); }
.arrows .best polygon { fill: rgba(47, 157, 88, .82); }
.arrows .threat line { stroke: rgba(226, 70, 60, .8); stroke-dasharray: .22 .14; }
.arrows .threat polygon { fill: rgba(226, 70, 60, .8); }

/* ---------- status, controls, moves ---------- */
.status { margin: 0; text-align: center; font-family: var(--font-display); font-weight: 400; font-size: 18px; min-height: 24px; text-wrap: balance; }
.status.wait { color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.moves { display: flex; gap: 4px 10px; overflow-x: auto; padding: 8px 10px; border-radius: 10px; background: var(--panel); font-size: 14px; white-space: nowrap; min-height: 22px; scrollbar-width: thin; }
.moves span { color: var(--muted); }
.moves b { font-weight: 600; }
.moves b.now { color: var(--yellow); }
.credit { margin: 4px 0 0; text-align: center; font-size: 11px; color: var(--line); }


/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(12, 9, 14, .74);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dialog { box-sizing: border-box; width: min(400px, 100%); padding: 22px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .7); display: flex; flex-direction: column; gap: 14px; }
.dialog h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.15; text-wrap: balance; }
.dialog p { margin: 0; color: var(--muted); }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.promo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.promo button { aspect-ratio: 1; border-radius: 12px; border: 2px solid var(--line); background-color: var(--sq-light); background-size: 80%; background-position: center; background-repeat: no-repeat; cursor: pointer; }
.promo button:hover { border-color: var(--paper); }


.toast { position: fixed; z-index: 40; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  max-width: calc(100% - 32px); box-sizing: border-box; padding: 9px 16px; border-radius: 12px; background: var(--paper); color: var(--ink); font-weight: 600; font-size: 14px; text-align: center; box-shadow: 0 12px 30px -10px rgba(0, 0, 0, .7); }

@media (max-width: 480px) {
  .brand { font-size: 17px; }
  .status { font-size: 16px; }
  .btn { padding: 8px 14px; font-size: 14px; }
  .clock { font-size: 15px; min-width: 56px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="gem" aria-hidden="true"></span>Back Rank</div>
    <div class="score" id="score" aria-label="Score"></div>
    <div class="top-tools">
      <span class="pill" id="pill"><i></i><span id="pill-text"></span></span>

    </div>
  </header>

  <form class="join" id="join" autocomplete="off">
    <div class="join-copy">
      <h2>Join a game</h2>
      <p>Type the 4-letter table code your friend sent you.</p>
    </div>
    <label>Table code<input class="field-input" id="join-code" maxlength="4" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="ABCD"></label>
    <label>Your name<input class="field-input" id="join-name" maxlength="20" placeholder="Name"></label>
    <button class="btn primary" id="join-btn" type="submit">Join</button>
    <p class="join-note" id="join-note" aria-live="polite"></p>
  </form>

  <div class="banner" id="banner" hidden><p id="banner-text"></p><div class="banner-actions" id="banner-actions"></div></div>

  <div class="bar" id="op-bar">
    <div class="who"><span class="swatch" id="op-swatch"></span><strong id="op-name">Computer</strong></div>
    <div class="caps" id="op-caps"></div>
    <div class="clock" id="op-clock" hidden></div>
  </div>

  <div class="board-wrap" id="board-wrap">

    <div class="board" id="board" role="grid" aria-label="Chess board"></div>
  </div>

  <div class="bar" id="me-bar">
    <div class="who"><span class="swatch" id="me-swatch"></span><strong id="me-name">You</strong></div>
    <div class="caps" id="me-caps"></div>
    <div class="clock" id="me-clock" hidden></div>
  </div>


  <p class="status" id="status" aria-live="polite"></p>
  <div class="controls">

    <button class="btn" id="btn-draw" type="button" hidden>Offer draw</button>
    <button class="btn danger" id="btn-resign" type="button" hidden>Resign</button>
    <button class="btn" id="btn-new" type="button" hidden>New game</button>
  </div>
  <div class="moves" id="moves" aria-label="Moves"></div>
  <p class="credit">Chess pieces by Colin M.L. Burnett, CC BY-SA 3.0</p>
</div>

<div class="overlay" id="promo-pick" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="promo-title">
    <h2 id="promo-title">Promote to</h2>
    <div class="promo" id="promo"></div>
    <div class="row"><button class="btn" id="promo-cancel" type="button">Cancel</button></div>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="over-title">
    <p class="eyebrow">Game over</p>
    <h2 id="over-title"></h2>
    <p id="over-score"></p>
    <p id="over-note" hidden></p>
    <div class="row" id="over-actions"></div>
  </div>
</div>

    g.at = Date.now();
    g.san = g.san.map(x => String(x).slice(0, 10));
    g.last = typeof g.last === 'string' && /^[a-h][1-8][a-h][1-8]$/.test(g.last) ? g.last : null;
    G.view = g;
    const ack = g.ack;
    if (G.waitN && ack && ack.sid === G.sid && ack.n >= G.waitN) {
      if (ack.e) toast(String(ack.e).slice(0, 140));
      G.waitN = 0;
      G.msg = null;
      G.pending = null;
    }
    if (App.mode !== 'guest') { App.mode = 'guest'; clearSelection(); closeOverlays(); }
  } else if (App.mode === 'guest') {
    App.mode = 'solo';
    G.view = null;
    G.waitN = 0;
    G.pending = null;
  }
  render();
}

const codeFromLink = () => ((location.hash.match(/^#([A-Za-z]{4})$/) || [])[1] || '').toUpperCase();
window.addEventListener('hashchange', () => {
  const code = codeFromLink();
  if (!code || code === Net.code) return;
  $('join-code').value = code;
  if (App.guest.myName) playerJoin(code);
});
$('join').addEventListener('submit', e => {
  e.preventDefault();
  App.guest.myName = cleanName($('join-name').value);
  playerJoin($('join-code').value);
});

const Role = {
  start() {
    const j = store.get('backrank:join', null) || {};
    App.guest.myName = cleanName(j.name);
    const code = codeFromLink() || j.code || '';
    $('join-name').value = App.guest.myName;
    $('join-code').value = code;
    if (code && App.guest.myName) playerJoin(code);
    else if (code) Net.note = 'Type your name and tap Join.';
  },
  engineFailed() { return true; },
  after() {},
  publish() {},
  send(a) {
    const G = App.guest;
    G.n += 1;
    G.waitN = G.n;
    G.pending = a.t === 'move' ? a : null;
    G.msg = {type: 'act', a, n: G.n, g: G.view.gid, sid: G.sid};
    try { Net.conn.send(G.msg); } catch {}
    render();
  },
  pill() {
    const host = App.guest.hostName || 'Host';
    switch (Net.state) {
      case 'connected': return {on: true, text: `${host} is here`};
      case 'connecting': return {on: false, text: 'Connecting…'};
      case 'nohost': return {on: false, text: 'Waiting for the table'};
      case 'lost': return {on: false, text: 'Reconnecting…'};
      case 'error': return {on: false, text: 'Connection problem'};
      default: return {on: false, text: 'Not at a table'};
    }
  },
  banner(v) {
    const host = App.guest.hostName || 'Host';
    if (App.mode === 'guest') {
      if (Net.state !== 'connected') return {text: Net.note || `Lost the connection to ${host}. Reconnecting…`, actions: [['Practice board', backToSolo]]};
      if (v && v.result) return {text: `Game over. ${host} starts the rematch.`};
      return null;
    }
    if (Net.state === 'connected') return {text: `You’re at ${host}’s table. They’ll start the game.`};
    return null;
  },
  rematch() {},
  marks() { return {arrows: [], hang: [], hint: null}; },
  extra() {
    const joinVisible = App.mode !== 'guest' && Net.state !== 'connected';
    $('join').hidden = !joinVisible;
    const btn = $('join-btn');
    btn.disabled = Net.state === 'connecting';
    btn.textContent = Net.state === 'connecting' ? 'Joining…' : Net.state === 'nohost' || Net.state === 'lost' ? 'Try again' : 'Join';
    $('join-note').textContent = Net.state === 'connecting' ? 'Connecting…' : Net.note || 'Until then, the board below is free to practice on.';
  },
  wake() {
    if (Net.code && Net.state !== 'connected' && Net.state !== 'connecting') { clearTimeout(Net.timer); playerJoin(Net.code); }
  },
  escape() { return false; },
  closeAll() {}
};

// ---------- rendering ----------
function render() {
  const v = currentView();
  renderTop(v);
  renderBanner(v);
  Role.extra(v);
  renderBars(v);
  renderBoard(v);
  renderStatus(v);
  renderControls(v);
  renderMoves(v);
  renderOver(v);
}
const fmtScore = x => (Math.floor(x) || (x % 1 ? '' : '0')) + (x % 1 ? '½' : '');
function renderTop(v) {
  const scoreEl = $('score');
  scoreEl.hidden = !v || v.free;
  if (v && !v.free) {
    const sc = v.sc || [0, 0];
    scoreEl.innerHTML = `<span>You</span><b>${fmtScore(Number(sc[0]) || 0)}</b><span>–</span><b>${fmtScore(Number(sc[1]) || 0)}</b><span>${esc(oppName(v))}</span>`;
  }
  const p = Role.pill();
  $('pill').classList.toggle('on', p.on);
  $('pill-text').textContent = p.text;
}
function offerBanner(v) {
  if (!v || v.result || v.offer !== 'op' || !interactive()) return null;
  return {text: `${oppName(v)} offers a draw.`, actions: [['Accept draw', () => doAction({t: 'draw'}), true], ['Decline', () => doAction({t: 'decline'})]]};
}
function renderBanner(v) {
  const b = offerBanner(v) || Role.banner(v);
  const key = b ? b.text + '|' + Net.code + '|' + (b.actions || []).map(a => a[0]).join('|') : '';
  if (key === App.ui.bannerKey) return;
  App.ui.bannerKey = key;
  $('banner').hidden = !b;
  if (!b) return;
  $('banner-text').innerHTML = esc(b.text).replace('{code}', `<b class="code">${esc(Net.code)}</b>`);
  const box = $('banner-actions');
  box.innerHTML = '';
  for (const [label, fn, primary] of b.actions || []) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn small' + (primary ? ' primary' : '');
    btn.textContent = label;
    btn.addEventListener('click', fn);
    box.append(btn);
  }
}

function material(fen) {
  const count = {w: {p: 0, n: 0, b: 0, r: 0, q: 0}, b: {p: 0, n: 0, b: 0, r: 0, q: 0}};
  for (const ch of fen.split(' ')[0]) {
    const t = ch.toLowerCase();
    if (!(t in START)) continue;
    count[ch === t ? 'b' : 'w'][t]++;
  }
  const worth = c => Object.entries(count[c]).reduce((sum, [t, n]) => sum + VALUE[t] * n, 0);
  return {count, diff: worth('w') - worth('b')};
}
function capsHTML(count, color, adv) {
  let html = '';
  for (const t of ['q', 'r', 'b', 'n', 'p']) {
    const missing = Math.max(0, START[t] - count[color][t]);
    for (let i = 0; i < missing; i++) html += `<span class="cap pc-${color}${t}${i ? ' same' : ''}" aria-hidden="true"></span>`;
  }
  if (adv > 0) html += `<span class="adv">+${adv}</span>`;
  return html;
}
function renderBars(v) {
  const me = v ? v.me : 'w', op = otherColor(me);
  const turn = turnOf(v);
  $('me-name').textContent = v && v.free ? (me === 'w' ? 'White' : 'Black') : 'You';
  $('op-name').textContent = oppName(v);
  $('me-swatch').className = 'swatch ' + me;
  $('op-swatch').className = 'swatch ' + op;
  $('me-bar').classList.toggle('turn', !!v && !v.result && turn === me);
  $('op-bar').classList.toggle('turn', !!v && !v.result && turn === op);
  const fen = v ? v.fen : START_FEN;
  const {count, diff} = material(fen);
  const mine = me === 'w' ? diff : -diff;
  $('me-caps').innerHTML = capsHTML(count, op, mine);
  $('op-caps').innerHTML = capsHTML(count, me, -mine);
  renderClocks(v);
}
function fmtClock(ms) {
  if (ms == null) return '';
  if (ms < 10000) return (ms / 1000).toFixed(1);
  const s = Math.ceil(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function renderClocks(v) {
  const has = !!(v && v.clock);
  for (const side of ['me', 'op']) {
    const el = $(side + '-clock');
    el.hidden = !has;
    if (!has) continue;
    const color = side === 'me' ? v.me : otherColor(v.me);
    const running = v.clock.run === color;
    const ms = Math.max(0, (Number(v.clock[color]) || 0) - (running ? Date.now() - (v.at || Date.now()) : 0));
    el.textContent = fmtClock(ms);
    el.classList.toggle('run', running);
    el.classList.toggle('low', running && ms < 20000);
  }
}

function squareAt(flip, dr, dc) {
  const file = flip ? 7 - dc : dc, rank = flip ? dr + 1 : 8 - dr;
  return {file, rank, sq: FILES[file] + rank};
}
function displayPos(flip, sq) {
  const file = FILES.indexOf(sq[0]), rank = Number(sq[1]);
  return flip ? {dr: rank - 1, dc: 7 - file} : {dr: 8 - rank, dc: file};
}
function arrowSVG(flip, arrows) {
  let out = '';
  for (const a of arrows) {
    const p = displayPos(flip, a.from), q = displayPos(flip, a.to);
    const x1 = p.dc + 0.5, y1 = p.dr + 0.5, x2 = q.dc + 0.5, y2 = q.dr + 0.5;
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
    const tipX = x2 - ux * 0.12, tipY = y2 - uy * 0.12, baseX = tipX - ux * 0.38, baseY = tipY - uy * 0.38;
    const px = -uy * 0.24, py = ux * 0.24;
    out += `<g class="${a.kind}"><line x1="${(x1 + ux * 0.2).toFixed(3)}" y1="${(y1 + uy * 0.2).toFixed(3)}" x2="${baseX.toFixed(3)}" y2="${baseY.toFixed(3)}"/>` +
      `<polygon points="${tipX.toFixed(3)},${tipY.toFixed(3)} ${(baseX + px).toFixed(3)},${(baseY + py).toFixed(3)} ${(baseX - px).toFixed(3)},${(baseY - py).toFixed(3)}"/></g>`;
  }
  return out ? `<svg class="arrows" viewBox="0 0 8 8" aria-hidden="true">${out}</svg>` : '';
}
function renderBoard(v) {
  const fen = v ? v.fen : START_FEN;
  const me = v ? v.me : 'w';
  const flip = me === 'b';
  const g = chessFor(fen);
  const turn = g.turn();
  const inCheck = g.inCheck();
  const last = v ? v.last : null;
  const marks = Role.marks(v, g);
  const sel = App.ui.sel;
  const targets = new Map(App.ui.targets.map(m => [m.to, m]));
  const key = [fen, flip, sel, [...targets.keys()].join(), last, JSON.stringify(marks)].join('|');
  if (key === App.ui.boardKey) return;
  App.ui.boardKey = key;
  const animKey = (v ? v.gid : '') + last + fen;
  const animate = last && App.ui.animKey && App.ui.animKey !== animKey;
  App.ui.animKey = animKey;
  const hang = new Set(marks.hang);
  let html = '';
  for (let dr = 0; dr < 8; dr++) {
    for (let dc = 0; dc < 8; dc++) {
      const {file, rank, sq} = squareAt(flip, dr, dc);
      const p = g.get(sq);
      const cls = ['sq', (file + rank) % 2 ? 'dark' : 'light'];
      if (last && (last.slice(0, 2) === sq || last.slice(2, 4) === sq)) cls.push('last');
      if (sel === sq) cls.push('sel');
      if (targets.has(sq)) cls.push(p ? 'cap' : 'dot');
      if (p && p.type === 'k' && p.color === turn && inCheck) cls.push('check');
      if (hang.has(sq)) cls.push('hang');
      if (marks.hint === sq) cls.push('hint');
      let inner = '';
      if (p) {
        let anim = '', style = '';
        if (animate && last.slice(2, 4) === sq) {
          const from = displayPos(flip, last.slice(0, 2));
          anim = ' anim';
          style = ` style="--dx:${(from.dc - dc) * 100}%;--dy:${(from.dr - dr) * 100}%"`;
        }
        inner += `<span class="pc pc-${p.color}${p.type}${anim}"${style}></span>`;
      }
      if (dr === 7) inner += `<span class="coord f">${FILES[file]}</span>`;
      if (dc === 0) inner += `<span class="coord r">${rank}</span>`;
      const label = sq + (p ? `, ${p.color === 'w' ? 'white' : 'black'} ${PIECE_NAME[p.type]}` : '');
      html += `<button class="${cls.join(' ')}" type="button" data-sq="${sq}" aria-label="${label}">${inner}</button>`;
    }
  }
  $('board').innerHTML = html + arrowSVG(flip, marks.arrows);
}

const REASON = {
  checkmate: ['Checkmate', 'by checkmate'], resign: ['Resigned', 'by resignation'], time: ['Out of time', 'on time'],
  stalemate: ['Draw by stalemate'], repetition: ['Draw by threefold repetition'], material: ['Draw: not enough pieces left to checkmate'],
  fifty: ['Draw by the 50-move rule'], agreement: ['Draw agreed'], 'time-material': ['Draw: time ran out, but there was nothing left to mate with']
};
function resultText(v) {
  const r = v.result, opp = oppName(v);
  if (r.win == null) return (REASON[r.why] || ['Draw'])[0] + '.';
  if (v.free) {
    const winner = (r.win === 'me') === (v.me === 'w') ? 'White' : 'Black';
    return `${winner} wins ${(REASON[r.why] || ['', ''])[1]}.`;
  }
  if (r.why === 'checkmate') return r.win === 'me' ? 'Checkmate. You win!' : `Checkmate. ${opp} wins.`;
  if (r.why === 'resign') return r.win === 'me' ? `${opp} resigned. You win!` : 'You resigned.';
  if (r.why === 'time') return r.win === 'me' ? `${opp} ran out of time. You win!` : 'You ran out of time.';
  return r.win === 'me' ? 'You win!' : `${opp} wins.`;
}
function renderStatus(v) {
  const el = $('status');
  let text = '', wait = false;
  if (!v) text = '';
  else if (v.result) text = resultText(v);
  else if (App.mode === 'guest' && App.guest.waitN) { text = 'Sending your move…'; wait = true; }
  else if (App.mode === 'guest' && Net.state !== 'connected') { text = 'Reconnecting…'; wait = true; }
  else {
    const g = chessFor(v.fen), turn = g.turn();
    if (v.free) text = (turn === 'w' ? 'White' : 'Black') + ' to move';
    else if (turn === v.me) text = 'Your move';
    else { text = `${oppName(v)} is thinking…`; wait = true; }
    if (g.inCheck()) text += ' · Check!';
  }
  el.textContent = text;
  el.classList.toggle('wait', wait);
}
function renderControls(v) {
  const vsPerson = !!v && !v.free && (App.mode === 'host' || App.mode === 'guest');
  const live = !!v && !v.result;
  const draw = $('btn-draw');
  draw.hidden = !(vsPerson && live);
  draw.disabled = !interactive() || (v && v.offer === 'me');
  draw.textContent = v && v.offer === 'me' ? 'Draw offered' : v && v.offer === 'op' ? 'Accept draw' : 'Offer draw';
  const resign = $('btn-resign');
  resign.hidden = !(live && !v.free);
  resign.disabled = !interactive();
  const armed = Date.now() < App.ui.resignArmed;
  resign.classList.toggle('armed', armed);
  resign.textContent = armed ? 'Tap again to resign' : 'Resign';
  $('btn-new').hidden = App.mode !== 'solo';
}
function renderMoves(v) {
  const san = v ? v.san : [];
  const key = (v ? v.gid : '') + san.length;
  if (key === App.ui.movesKey) return;
  App.ui.movesKey = key;
  const el = $('moves');
  if (!san.length) { el.innerHTML = '<span>Moves show up here.</span>'; return; }
  let html = '';
  for (let i = 0; i < san.length; i += 2) {
    html += `<span>${i / 2 + 1}.</span><b${i === san.length - 1 ? ' class="now"' : ''}>${esc(san[i])}</b>`;
    if (san[i + 1]) html += `<b${i + 1 === san.length - 1 ? ' class="now"' : ''}>${esc(san[i + 1])}</b>`;
  }
  el.innerHTML = html;
  el.scrollLeft = el.scrollWidth;
}
function renderOver(v) {
  const show = !!(v && v.result && App.ui.overDismissed !== v.gid);
  const el = $('over');
  if (!show) { el.hidden = true; App.ui.overKey = ''; return; }
  const opp = oppName(v);
  const key = `${v.gid}|${App.mode}|${!!(App.host && App.host.here)}|${opp}`;
  el.hidden = false;
  if (key === App.ui.overKey) return;
  App.ui.overKey = key;
  $('over-title').textContent = resultText(v);
  const sc = v.sc || [0, 0];
  $('over-score').textContent = v.free ? '' : `Score: You ${fmtScore(sc[0])}, ${opp} ${fmtScore(sc[1])}`;
  $('over-score').hidden = !!v.free;
  const note = $('over-note');
  note.hidden = App.mode !== 'guest';
  note.textContent = `${opp} starts the rematch.`;
  const box = $('over-actions');
  box.innerHTML = '';
  const add = (label, fn, primary) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn' + (primary ? ' primary' : '');
    b.textContent = label;
    b.addEventListener('click', fn);
    box.append(b);
  };
  if (App.mode === 'solo') add('New game', dealSolo, true);
  else if (App.mode === 'host') Role.rematch(add);
  add('See the board', () => { App.ui.overDismissed = v.gid; render(); });
  const first = box.querySelector('button');
  if (first) first.focus();
}

function closeOverlays() { $('promo-pick').hidden = true; App.ui.promo = null; Role.closeAll(); }
let toastTimer = 0;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2800);
}

// ---------- input: tap a piece, then tap where it goes ----------
$('board').addEventListener('click', e => {
  const b = e.target.closest('[data-sq]');
  if (!b) return;
  const sq = b.dataset.sq;
  const v = currentView();
  if (!v || v.result) return;
  if (!canMove(v)) {
    if (!interactive()) return;
    toast(`It’s ${oppName(v)}’s move.`);
    return;
  }
  const g = chessFor(v.fen);
  if (App.ui.sel) {
    const options = App.ui.targets.filter(m => m.to === sq);
    if (options.length) {
      const from = App.ui.sel;
      clearSelection();
      if (options.some(m => m.promotion)) openPromo(from, sq, g.turn());
      else doAction({t: 'move', from, to: sq});
      render();
      return;
    }
  }
  const p = g.get(sq);
  if (p && p.color === g.turn() && App.ui.sel !== sq) {
    App.ui.sel = sq;
    App.ui.targets = g.moves({square: sq, verbose: true});
  } else clearSelection();
  render();
});
function openPromo(from, to, color) {
  App.ui.promo = {from, to};
  $('promo').innerHTML = ['q', 'r', 'b', 'n'].map(t =>
    `<button type="button" class="pc-${color}${t}" data-p="${t}" aria-label="${PIECE_NAME[t]}"></button>`).join('');
  $('promo-pick').hidden = false;
  $('promo').querySelector('button').focus();
}
$('promo').addEventListener('click', e => {
  const b = e.target.closest('[data-p]');
  if (!b || !App.ui.promo) return;
  const {from, to} = App.ui.promo;
  $('promo-pick').hidden = true;
  App.ui.promo = null;
  doAction({t: 'move', from, to, promo: b.dataset.p});
});
$('promo-cancel').addEventListener('click', () => { $('promo-pick').hidden = true; App.ui.promo = null; });
$('btn-draw').addEventListener('click', () => doAction({t: 'draw'}));
$('btn-resign').addEventListener('click', () => {
  if (Date.now() < App.ui.resignArmed) { App.ui.resignArmed = 0; doAction({t: 'resign'}); return; }
  App.ui.resignArmed = Date.now() + 3000;
  render();
  setTimeout(render, 3050);
});
$('btn-new').addEventListener('click', dealSolo);
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('promo-pick').hidden) { $('promo-pick').hidden = true; App.ui.promo = null; return; }
  if (Role.escape()) return;
  if (App.ui.sel) { clearSelection(); render(); }
});

// Clocks tick on screen; the page that runs the game also calls time when a flag falls.
setInterval(() => {
  const v = currentView();
  if (v && v.clock && v.clock.run) renderClocks(v);
  for (const ctx of [App.solo, App.host]) if (ctx && ctx.s && tickClock(ctx.s)) afterChange();
}, 200);

// ---------- boot ----------
(function start() {
  const saved = store.get(SAVE_KEY, null);
  if (saved && saved.settings) App.settings = {...App.settings, ...saved.settings};
  App.solo = saved && saved.solo && saved.solo.s ? saved.solo : {s: null, score: {A: 0, B: 0}, nextColor: 'w', scored: null};
  const h = saved && saved.host;
  App.host = {
    s: h && h.s ? h.s : null, score: (h && h.score) || {A: 0, B: 0}, nextColor: (h && h.nextColor) || 'w',
    guestName: (h && h.guestName) || '', lastN: (h && h.lastN) || {}, scored: (h && h.scored) || null,
    here: false, ack: null
  };
  Role.start(saved);
  if (!App.solo.s) App.solo.s = newChessGame({colorA: soloIsFree() ? 'w' : pickColor(App.solo)});
  render();
  Role.after();
})();
</script>
</body>
</html>
